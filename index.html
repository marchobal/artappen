<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Artappen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2f6b3a">
<title>Artappen</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --text: #1d1f1c; --muted: #6b6f68;
    --accent: #2f6b3a; --line: #e3e1da; --bar: #cfe3d2;
    --redbg: #fdf0ee; --redline: #f0c4bd; --redtext: #a8321f;
    --me: #1e6fd9; --explore: #6741d9; --sel: #d6336c; --trip: #e8590c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141613; --card: #1d201c; --text: #ecebe6; --muted: #9a9e96;
            --accent: #7fc28b; --line: #2e322d; --bar: #2c4a31;
            --redbg: #2a1b18; --redline: #5a2e26; --redtext: #f0a08f;
            --me: #4d94ff; --explore: #9775fa; --sel: #f06595; --trip: #ff922b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 12px max(12px, env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  h2 { font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
  button { font: inherit; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line);
           background: var(--card); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.stop { background: transparent; color: #c0392b; border-color: #c0392b; }
  button:disabled { opacity: .6; cursor: default; }
  select { font: inherit; font-size: .9rem; padding: 5px 6px; border-radius: 8px; border: 1px solid var(--line);
           background: var(--card); color: var(--text); }
  .muted { color: var(--muted); }
  .err { color: #c0392b !important; }

  /* Toppraden */
  .topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin: 4px 0 12px; }
  .brand { font-weight: 700; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
  .brand img { width: 26px; height: 26px; border-radius: 6px; }
  .brand small { font-weight: 400; color: var(--muted); font-size: .8rem; }
  /* Djurgrupp och år: två lika breda rader, knapparna delar bredden */
  .controls { display: flex; flex-direction: column; gap: 8px; width: 440px; max-width: 100%; }
  .yearwrap { position: relative; }
  .controls .seg { display: flex; width: 100%; }
  .controls .seg button { flex: 1 1 0; padding-left: 4px; padding-right: 4px; white-space: nowrap; }
  .yearpick { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; display: flex; align-items: center; gap: 10px;
              flex-wrap: wrap; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
              box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  .yearpick[hidden] { display: none; }
  .yearpick button { padding: 5px 14px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
  .seg button { border: 0; border-radius: 0; padding: 6px 12px; background: transparent; font-size: .9rem; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: #fff; }
  .yr { font-size: .9rem; color: var(--muted); }

  /* Rubrik för artlistan med antal och statusrad */
  .listhead { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 10px; margin: 0 0 8px 2px; }
  .listhead h2 { margin: 0; font-size: 1rem; text-transform: none; letter-spacing: 0; color: var(--text); }
  #count { color: var(--accent); font-variant-numeric: tabular-nums; }
  #count:not(:empty)::before { content: '('; color: var(--muted); font-weight: 400; }
  #count:not(:empty)::after { content: ')'; color: var(--muted); font-weight: 400; }
  #obsCount { font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #obsCount:empty { display: none; }
  #status { font-size: .8rem; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status:empty { display: none; }

  /* Resknappen i toppraden */
  .brandrow { display: flex; align-items: center; gap: 10px; }
  .tripbtn { padding: 6px 12px; font-size: .88rem; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .tripbtn.stop::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  #tripShow { padding: 6px 10px; font-size: .85rem; color: var(--muted); }

  /* Djurgrupper med sin figur. Raden kan skrollas i sidled om fler grupper läggs till. */
  #groupSeg { overflow-x: auto; scrollbar-width: none; }
  #groupSeg button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  #groupSeg img { width: 26px; height: 20px; object-fit: contain; flex: none; }
  @media (max-width: 480px) {
    #groupSeg button { flex-direction: column; gap: 1px; font-size: .8rem; padding-top: 5px; padding-bottom: 5px; min-width: 76px; }
  }

  /* Karta */
  .mapcard { padding: 0; overflow: hidden; }
  #map { height: 46vh; min-height: 260px; z-index: 0; background: var(--line); }
  #map.exploring { cursor: crosshair; }
  body.triprun .myring { animation: radar 3s ease-in-out infinite; }
  @keyframes radar { 50% { stroke-opacity: .15; } }
  .myring.scanned { animation: scan 1.2s ease-out !important; }
  @keyframes scan { 0% { stroke-width: 7px; stroke-opacity: 1; } 100% { stroke-width: 1.5px; stroke-opacity: .5; } }
  #map.twofinger { touch-action: pan-x pan-y; } /* ett finger skrollar sidan */
  .twofinger-tip { position: absolute; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center;
                   padding: 20px; text-align: center; color: #fff; font-weight: 600; background: rgba(0,0,0,.45);
                   opacity: 0; transition: opacity .25s; pointer-events: none; }
  .twofinger-tip.show { opacity: 1; }
  .mapseg { display: flex; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 5px rgba(0,0,0,.25); background: var(--card); }
  .mapseg button { border: 0; border-radius: 0; padding: 7px 12px; font-size: .85rem; background: var(--card); color: var(--text); }
  .mapseg button + button { border-left: 1px solid var(--line); }
  .mapseg button.on { background: var(--accent); color: #fff; }
  .mapseg button[data-mode=explore].on { background: var(--explore); }
  .maphint { background: var(--card); color: var(--text); border-radius: 8px; padding: 5px 10px; font-size: 12.5px;
             box-shadow: 0 1px 5px rgba(0,0,0,.25); max-width: 260px; }
  .maphint b { color: var(--sel); }
  .maphint button { margin-left: 6px; padding: 0 6px; font-size: 12px; }
  .leaflet-bar a { background: var(--card); color: var(--text); border-color: var(--line); }
  .leaflet-container { font: inherit; }
  .basemap { filter: grayscale(1) brightness(1.06) contrast(.82); }
  @media (prefers-color-scheme: dark) { .basemap { filter: grayscale(1) invert(1) brightness(.78) contrast(.85); } }
  .leaflet-popup-content { font-size: 13px; }
  .leaflet-control-attribution { font-size: 10px; opacity: .7; }

  /* Artlistan */
  ol { list-style: none; padding: 0; margin: 0; }
  .listcard li { position: relative; display: flex; align-items: baseline; gap: 8px; padding: 4px 9px; margin-bottom: 2px;
                 border-radius: 8px; overflow: hidden; font-size: .9rem; cursor: pointer; }
  .listcard li:hover { box-shadow: inset 0 0 0 1px var(--muted); }
  .listcard li.sel { box-shadow: inset 0 0 0 2px var(--sel); }
  li .barfill { position: absolute; inset: 0 auto 0 0; background: var(--bar); z-index: 0; border-radius: 8px; }
  li > span { position: relative; z-index: 1; }
  li .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .dt { color: var(--muted); font-size: .8rem; margin-left: 6px; }
  li .cnt { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85rem; }
  .listcard h3 { font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin: 0 0 6px 2px; color: var(--muted); }
  .redgroup { border: 1px solid var(--redline); background: var(--redbg); border-radius: 10px; padding: 8px 8px 4px; margin-top: 12px; }
  .redgroup h3 { color: var(--redtext); }
  .redgroup .more { color: var(--redtext); border-color: var(--redline); margin-bottom: 4px; }
  .badge { display: inline-block; font-size: .68rem; font-weight: 700; padding: 1px 5px; border-radius: 4px;
           margin-right: 6px; color: #fff; vertical-align: 1px; }
  .badge.cr { background: #b3001b; } .badge.en { background: #d9480f; } .badge.vu { background: #e8a200; color: #1d1f1c; }
  li .dt.today { color: var(--card); background: var(--accent); border-radius: 4px; padding: 0 5px; font-weight: 600; }
  li .dt.week { color: var(--accent); font-weight: 600; }
  .badge.new { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .badge.ssp { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--muted); cursor: help; }
  .empty { color: var(--muted); font-size: .9rem; margin: 4px 0; }
  .more { display: block; width: 100%; margin-top: 8px; padding: 7px; font-size: .88rem; color: var(--accent);
          background: transparent; border: 1px dashed var(--line); }

  /* Kurva och resa */
  #chart { width: 100%; height: 110px; display: block; }
  /* Resesammanfattning och topplista */
  .tripsum { margin-bottom: 10px; }
  .tripsum .big { font-size: 1.5rem; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .tripsum .big span { font-size: .95rem; font-weight: 600; color: var(--text); }
  /* Delarna radbryts bara mellan delarna, aldrig mitt i "34 däggdjur" */
  .tripsum .groups, .tripsum .parts { display: flex; flex-wrap: wrap; column-gap: 12px; row-gap: 1px; }
  .tripsum .groups { font-size: .88rem; margin: 2px 0 3px; }
  .tripsum .groups > * { white-space: nowrap; }
  .tripsum .parts { font-size: .8rem; color: var(--muted); }
  .tripsum .parts span { white-space: nowrap; }
  .tripsum .parts span + span::before { content: '·'; margin: 0 6px 0 -6px; }
  .tripsum .newline { font-size: .8rem; color: var(--accent); font-weight: 600; margin-top: 3px; }
  .topseg { display: flex; width: 100%; margin-bottom: 8px; }
  .topseg button { flex: 1; padding: 5px 4px; font-size: .82rem; }
  .toplist li { display: flex; align-items: center; gap: 8px; padding: 3px 2px; font-size: .88rem; border-bottom: 1px solid var(--line); }
  .toplist li:last-child { border-bottom: 0; }
  .toplist .rank { width: 1.4em; text-align: right; color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
  .toplist img { width: 24px; height: 18px; object-fit: contain; flex: none; }
  .toplist .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toplist .cnt { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
  .toplist li[data-key] { cursor: pointer; }
  /* Info-knapp på varje art */
  .infobtn { position: relative; z-index: 1; flex: none; width: 22px; height: 22px; padding: 0; border-radius: 50%;
             font: italic 700 13px/20px Georgia, serif; color: var(--muted); background: var(--card); border: 1px solid var(--line); }
  .infobtn:hover { color: var(--accent); border-color: var(--accent); }
  /* Informationskortet: underifrån i mobilen, i mitten på datorn */
  .sheet-backdrop { position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; }
  .sheet-backdrop[hidden] { display: none; }
  .sheet { position: relative; width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; background: var(--card); color: var(--text);
           border-radius: 18px 18px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 24px rgba(0,0,0,.3); }
  @media (min-width: 900px) { .sheet-backdrop { align-items: center; } .sheet { border-radius: 18px; max-height: 86vh; } }
  .sheet-close { position: absolute; top: 10px; right: 10px; z-index: 2; width: 34px; height: 34px; padding: 0; border-radius: 50%;
                 background: rgba(0,0,0,.45); color: #fff; border: 0; font-size: 15px; }
  .info-img { margin: -16px -16px 12px; }
  .info-img img { display: block; width: 100%; max-height: 300px; object-fit: cover; border-radius: 18px 18px 0 0; background: var(--line); }
  .info-img .credit { font-size: .72rem; color: var(--muted); padding: 4px 16px 0; }
  .info-img .credit a, .info-src a { color: inherit; }
  .sheet h2#infoTitle { font-size: 1.35rem; text-transform: none; letter-spacing: 0; color: var(--text); margin: 0; padding-right: 40px; }
  .info-sci { color: var(--muted); font-style: italic; margin: 2px 0 8px; }
  .info-facts { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
  .info-facts span { font-size: .8rem; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
  /* Färgschema och pixelfigur (byggs i förväg på Macen från frilagda foton) */
  .palette { display: flex; height: 22px; border-radius: 6px; overflow: hidden; margin: 2px 0 4px; }
  .palette i { display: block; min-width: 0; }
  .pal-row { display: flex; align-items: center; gap: 12px; margin: 4px 0 2px; }
  .pal-row .palette { flex: 1; }
  .sprite { width: 48px; height: 48px; image-rendering: pixelated; flex: none; }
  .pal-credit { font-size: .72rem; color: var(--muted); margin-bottom: 10px; }
  .pal-credit a { color: inherit; }
  li .minipal { display: inline-flex; vertical-align: 1px; margin-left: 7px; height: 8px; width: 34px; border-radius: 2px; overflow: hidden; }
  li .minipal i { display: block; height: 100%; }
  .info-text { line-height: 1.5; font-size: .95rem; margin: 0 0 4px; }
  .info-src { font-size: .72rem; color: var(--muted); margin-bottom: 14px; }
  .info-links { display: flex; flex-wrap: wrap; gap: 8px; }
  .info-links a, .info-links button { font-size: .88rem; padding: 7px 12px; border-radius: 10px; border: 1px solid var(--line);
                                      color: var(--text); text-decoration: none; background: var(--card); }
  .info-links .primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .small { font-size: .8rem; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tripbtns { display: flex; gap: 8px; }
  /* Stationärt läge (ingen resa): bara en liten ruta som erbjuder resan */
  body:not(.tripview) .chartcard, body:not(.tripview) .topcard, body:not(.tripview) .tripcard { display: none; }
  .tripcard h2 { display: flex; justify-content: space-between; align-items: center; }
  #tripHide { border: 0; background: transparent; color: var(--muted); font-size: .8rem; padding: 2px 4px; text-transform: none; letter-spacing: 0; }
  body:not(.tripview) #tripHide, body.triprun #tripHide { display: none; }
  .tripbtns button { flex: 1; }
  #gpsStatus { font-size: .85rem; color: var(--muted); margin-top: 10px; min-height: 2.6em; line-height: 1.3; white-space: pre-line;
               display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* Mobil: allt i en kolumn – listan, kartan och sedan resan */
  @media (max-width: 899px) {
    .layout, .left, .bottomrow, .right { display: contents; }
    .layout { display: flex; flex-direction: column; }
    .listcard { order: 2; } .mapcard { order: 3; } .chartcard { order: 4; } .tripcard { order: 5; } .topcard { order: 6; }
    .controls { width: 100%; }
    .yearpick { left: 0; right: 0; }
    .seg button { padding: 8px 10px; }
    .brandrow { width: 100%; }
    .brandrow .tripbtn { margin-left: auto; }
    #tripShow + .tripbtn, .tripbtn + #tripShow:not([hidden]) { margin-left: 0; }
  }
  @media (max-width: 480px) { .brand small { display: none; } }

  /* Dator: allt på en skärm */
  @media (min-width: 900px) and (min-height: 560px) {
    body { height: 100vh; overflow: hidden; }
    main { max-width: none; height: 100vh; display: flex; flex-direction: column; padding: 12px 16px; }
    .topbar { margin: 0 0 10px; }
    .layout { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(340px, 1fr); gap: 12px; }
    .left { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
    .card { margin: 0; }
    .mapcard { flex: 1; display: flex; min-height: 0; }
    #map { flex: 1; height: auto; min-height: 200px; }
    .bottomrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
    .chartcard, .tripcard { height: 206px; }
    body:not(.tripview) .bottomrow { display: none; }
    .listhead { position: sticky; top: -14px; background: var(--card); margin: -14px -14px 8px; padding: 12px 16px 8px; z-index: 2; }
    .tripcard { overflow-y: auto; }
    #chart { height: 130px; }
    .right { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
    .right .listcard { flex: 1; }
    .topcard { flex: none; max-height: 300px; overflow-y: auto; }
    #chart { height: 92px; }
    .listcard { min-height: 0; overflow-y: auto; }
    .listcard ol.two { column-count: 2; column-gap: 8px; }
    .listcard ol.two li { break-inside: avoid; }
  }
</style>
</head>
<body>
<main>
  <header class="topbar">
    <div class="brandrow">
      <div class="brand"><img src="icon-192.png" alt="">Artappen <small>Artportalen via GBIF</small></div>
      <button class="primary tripbtn" id="startBtn" title="Följ dig längs vägen och samla arter, med kurva och topplista">Starta resa</button>
      <button id="tripShow" hidden title="Visa den sparade resan">Visa resa</button>
    </div>
    <div class="controls">
      <div class="seg" id="groupSeg" role="group" aria-label="Djurgrupp">
        <button data-group="mammals"><img src="img/mammals.png" alt="">Däggdjur</button>
        <button data-group="birds"><img src="img/birds.png" alt="">Fåglar</button>
        <button data-group="herps"><img src="img/herps.png" alt="">Grod- & kräldjur</button>
      </div>
      <div class="yearwrap">
        <div class="seg" id="yearChips" role="group" aria-label="Vilka år">
          <button data-span="1">I år</button>
          <button data-span="5">5 år</button>
          <button data-span="10">10 år</button>
          <button data-span="0">Alla år</button>
          <button id="yearPickBtn" aria-expanded="false">Välj</button>
        </div>
        <div class="yearpick" id="yearPick" hidden>
          <label class="yr">Från <select id="yearFrom"></select></label>
          <label class="yr">till <select id="yearTo"></select></label>
          <button class="primary" id="yearPickDone">Klar</button>
        </div>
      </div>
    </div>
  </header>

  <div class="layout">
    <div class="left">
      <section class="card mapcard"><div id="map"></div></section>

      <div class="bottomrow">
        <section class="card chartcard">
          <h2>Arter längs resan</h2>
          <svg id="chart"></svg>
          <div class="small" id="chartInfo"></div>
        </section>
        <section class="card tripcard">
          <h2>Resa <button id="tripHide" title="Dölj resan (den sparas tills du rensar)">Dölj</button></h2>
          <div id="tripSummary" class="tripsum"></div>
          <div class="tripbtns">
            <button id="clearBtn">Rensa resan</button>
          </div>
          <div id="gpsStatus">Resan följer din position och hämtar nya arter var 300:e meter.</div>
        </section>
      </div>
    </div>

    <div class="right">
    <section class="card listcard">
      <div class="listhead"><h2><span id="countLabel">Arter i närheten</span> <span id="count"></span></h2><span id="obsCount"></span><span id="status">Söker din position…</span></div>
      <div id="list"><p class="empty">Inga data ännu.</p></div>
    </section>
      <section class="card topcard">
          <h2>Topplista för resan</h2>
          <div class="seg topseg" id="topSeg" role="group" aria-label="Topplista">
            <button data-top="red">Hotade</button>
            <button data-top="rare">Ovanligast</button>
            <button data-top="common">Vanligast</button>
          </div>
          <ol class="toplist" id="topList"></ol>
        </section>
    </div>
  </div>
</main>

<!-- Informationskort om en art -->
<div class="sheet-backdrop" id="infoBackdrop" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
    <button class="sheet-close" id="infoClose" aria-label="Stäng">✕</button>
    <div id="infoBody"></div>
  </div>
</div>

<script>
const DATASET = '38b4c89f-584c-41bb-bd8f-cd1def33e92f'; // Artportalen
const GROUPS = {
  mammals: { keys: [359], red: [['Mammalia', 'CLASS']], label: 'Däggdjur', noun: 'däggdjursarter', none: 'däggdjursobservationer' },
  birds:   { keys: [212], red: [['Aves', 'CLASS']], label: 'Fåglar', noun: 'fågelarter', none: 'fågelobservationer' },
  herps:   { keys: [131, 11592253, 11418114], // groddjur, ödlor och ormar (Squamata), sköldpaddor (Testudines)
             red: [['Amphibia', 'CLASS'], ['Squamata', 'ORDER']], label: 'Grod- och kräldjur',
             noun: 'arter av grod- och kräldjur', none: 'observationer av grod- och kräldjur' },
};
const taxonParam = g => g.keys.map(k => `&taxonKey=${k}`).join('');
const OCC = 'https://api.gbif.org/v1/occurrence/search';
const THIS_YEAR = new Date().getFullYear();
const FIRST_YEAR = 1970;
const RADIUS_KM = 5;
const MOVE_M = 300;         // resan hämtar igen när du flyttat dig minst så här långt …
const MIN_GAP_MS = 10_000;  // … men inte oftare än så här
const HOME_MOVE_M = 500;    // utan resa räcker det att hämta om när du flyttat dig 500 m
// GBIF tar emot Artportalens data ungefär en gång i veckan. I stället för att hämta allt med jämna
// mellanrum frågar appen en gång i timmen (ett litet anrop) om det kommit nytt, och hämtar bara då.
const FRESH_CHECK_MS = 60 * 60_000;
const FILTER_KEY = 'artappen.filter', TRACK_KEY = 'artappen.track', NAME_KEY = 'artappen.names.v2';
const MON = ['jan', 'feb', 'mar', 'apr', 'maj', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];

const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
function load(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } }
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }
const fmtN = n => n.toLocaleString('sv-SE');
const clock = t => new Date(t).toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });

// ---- Tillstånd ----
// Två platser kan visas: resans (GPS) och en punkt man utforskar på kartan.
// Resan fortsätter att samla data i bakgrunden även när man utforskar.
let pos = null;            // senaste godkända GPS-position
let mode = 'gps';          // 'gps' = visa din position, 'explore' = visa vald punkt
let exploreAt = null;      // { lat, lon }
let tripRes = null, exploreRes = null; // { lat, lon, yr, t, acc?, byGroup: { id: { counts, total } }, latest: {} }
let lastFetch = null, timer = null, watchId = null;
// Appen är stationär i första hand: den visar arterna där du är. Resan slås på med Starta resa.
const TRIPVIEW_KEY = 'artappen.tripView';
let tripOn = false;                           // resan pågår (spelar in punkter, håller skärmen tänd)
let tripView = load(TRIPVIEW_KEY, false);     // resans rutor visas (pågående eller sparad resa)
let tripSeq = 0, exploreSeq = 0, renderSeq = 0;

// Varje punkt på resan: { t, lat, lon, acc, yr, n: { mammals, birds, herps }, obs: {…} }
let track = load(TRACK_KEY, []).map(p => {
  if (p.yr !== undefined) return p;
  const [g, yr] = (p.f || 'mammals|-').split('|');  // äldre format: en grupp per punkt
  return { t: p.t, lat: p.lat, lon: p.lon, yr, n: { [g]: p.n }, obs: { [g]: p.obs } };
});
const names = load(NAME_KEY, {});
let filter = Object.assign({ group: 'mammals', from: null, to: null }, load(FILTER_KEY, {}));
if (!GROUPS[filter.group]) filter.group = 'mammals';

const grp = () => GROUPS[filter.group];
const yearId = () => `${filter.from ?? ''}-${filter.to ?? ''}`;
const yearParam = () => (filter.from || filter.to) ? `&year=${filter.from ?? '*'},${filter.to ?? '*'}` : '';
function yearText() {
  const { from, to } = filter;
  if (!from && !to) return 'alla år';
  if (from && to) return from === to ? `${from}` : `${from}–${to}`;
  return from ? `från ${from}` : `till ${to}`;
}
const viewRes = () => mode === 'explore' ? exploreRes : tripRes;
const viewPoint = () => mode === 'explore' ? exploreAt : (pos && { lat: pos.coords.latitude, lon: pos.coords.longitude });

function setStatus(msg, err = false) { const s = $('status'); s.textContent = msg; s.title = msg; s.classList.toggle('err', err); }
function setGps(msg, err = false) { if (!tripView) { if (err || !pos) setStatus(msg, err); return; } const s = $('gpsStatus'); s.textContent = msg; s.title = msg; s.classList.toggle('err', err); }

async function mapLimit(items, n, fn) {
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => {
    while (i < items.length) { const j = i++; await fn(items[j], j); }
  }));
}

function distKm(a, b) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

// ---- Hämtning från GBIF ----
async function facet(g, lat, lon, extra) {
  const url = `${OCC}?datasetKey=${DATASET}${taxonParam(g)}&geoDistance=${lat},${lon},${RADIUS_KM}km${extra}` +
    `&limit=0&facet=speciesKey&facetLimit=1000`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  return { counts: (data.facets?.[0]?.counts || []).map(c => ({ key: c.name, n: c.count })), total: data.count };
}

// Alla djurgrupper på en gång, så att man kan växla grupp utan ny hämtning.
async function fetchAll(lat, lon) {
  const ids = Object.keys(GROUPS);
  const res = await Promise.all(ids.map(id => facet(GROUPS[id], lat, lon, yearParam())));
  return { lat, lon, yr: yearId(), t: Date.now(), latest: {}, byGroup: Object.fromEntries(ids.map((id, i) => [id, res[i]])) };
}

// Din position: hämtar där du är. Pågår en resa sparas också en punkt.
async function update() {
  if (!pos) return;
  const my = ++tripSeq;
  const { latitude: lat, longitude: lon, accuracy: acc } = pos.coords;
  lastFetch = { lat, lon, t: Date.now() };
  if (mode === 'gps') setStatus('Hämtar observationer…');
  try {
    const r = await fetchAll(lat, lon);
    if (my !== tripSeq) return;
    r.acc = acc;
    tripRes = r;
    if (tripOn) { // utan resa sparas inga punkter
      track.push({ t: r.t, lat, lon, acc: Math.round(acc), yr: r.yr,
                   n: Object.fromEntries(Object.entries(r.byGroup).map(([k, v]) => [k, v.counts.length])),
                   obs: Object.fromEntries(Object.entries(r.byGroup).map(([k, v]) => [k, v.total])) });
      save(TRACK_KEY, track);
      collectTrip(r);
      drawChart(); drawTrack(); renderTrip();
      scanFlash();
    }
    showProgress();
    if (mode === 'gps') renderCurrent();
  } catch (e) {
    if (my === tripSeq && mode === 'gps') setStatus('Kunde inte hämta data: ' + e.message, true);
  }
}

// Utforska: hämtar vid vald punkt, påverkar inte resan.
async function exploreFetch() {
  if (!exploreAt) return;
  const my = ++exploreSeq;
  if (mode === 'explore') { setStatus('Hämtar observationer för vald punkt…'); $('count').textContent = ''; $('obsCount').textContent = ''; }
  try {
    const r = await fetchAll(exploreAt.lat, exploreAt.lon);
    if (my !== exploreSeq) return;
    exploreRes = r;
    if (mode === 'explore') renderCurrent();
  } catch (e) {
    if (my === exploreSeq && mode === 'explore') setStatus('Kunde inte hämta data: ' + e.message, true);
  }
}

// ---- Artnamn ----
async function speciesName(key) {
  if (names[key]) return names[key];
  let swe = null, sci = null;
  try {
    const [v, s] = await Promise.all([
      fetch(`https://api.gbif.org/v1/species/${key}/vernacularNames?limit=300`).then(r => r.json()),
      fetch(`https://api.gbif.org/v1/species/${key}`).then(r => r.json()),
    ]);
    // Svenskt namn: Dyntaxas (Artdatabankens) föredragna namn, annars annat föredraget, annars det första.
    const swes = (v.results || []).filter(r => r.language === 'swe');
    const hit = swes.find(r => /Dyntaxa/.test(r.source || '') && r.preferred)
             || swes.find(r => r.preferred) || swes.find(r => /Dyntaxa|Red List/.test(r.source || '')) || swes[0];
    if (hit) swe = hit.vernacularName.charAt(0).toUpperCase() + hit.vernacularName.slice(1);
    sci = s.canonicalName || s.scientificName || null;
  } catch {}
  const entry = { swe, sci };
  if (sci) { names[key] = entry; save(NAME_KEY, names); }
  return entry;
}

// ---- Senaste observation per art ----
// GBIF kan inte sortera på datum. I stället delas tiden upp i "fack" (de senaste dagarna,
// sedan månader, sedan år) och vi söker oss fram genom halvering: fråga vilka arter som
// finns i den nyare halvan av ett intervall, gå vidare där, och resten i den äldre halvan.
// Bara intervall som innehåller arter frågas, så det blir få anrop. Max 4 samtidigt och
// automatiskt nytt försök om GBIF svarar "för många anrop" (429).
// Resultatet återanvänds så länge man är inom 1 km och 30 min från där det räknades fram.
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);

function dateLeaves() {
  const L = [], today = new Date(); today.setHours(0, 0, 0, 0);
  for (let i = 0; i < 7; i++) {
    const d = addDays(today, -i);
    L.push({ a: d, b: d, fresh: i === 0 ? 'today' : 'week', label: i === 0 ? 'idag' : i === 1 ? 'igår' : `${d.getDate()} ${MON[d.getMonth()]}` });
  }
  const restEnd = addDays(today, -7);
  const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
  if (restEnd >= monthStart) L.push({ a: monthStart, b: restEnd, label: MON[today.getMonth()] });
  for (let m = today.getMonth() - 1; m >= -12; m--) {            // resten av i år och hela förra året
    const a = new Date(today.getFullYear(), m, 1), b = new Date(a.getFullYear(), a.getMonth() + 1, 0);
    L.push({ a, b, label: a.getFullYear() === THIS_YEAR ? MON[a.getMonth()] : `${MON[a.getMonth()]} ${a.getFullYear()}` });
  }
  for (let y = THIS_YEAR - 2; y >= THIS_YEAR - 15; y--) L.push({ a: new Date(y, 0, 1), b: new Date(y, 11, 31), label: `${y}` });
  const oldEnd = THIS_YEAR - 16;
  L.push({ a: new Date(1600, 0, 1), b: new Date(oldEnd, 11, 31), label: `före ${oldEnd + 1}` });
  // Begränsa till valda år
  return L.filter(x => (!filter.from || x.b.getFullYear() >= filter.from) && (!filter.to || x.a.getFullYear() <= filter.to));
}

// Enkel kö: högst 4 anrop åt gången, nytt försök vid 429
let active = 0; const waiting = [];
async function throttled(fn) {
  if (active >= 4) await new Promise(r => waiting.push(r));
  active++;
  try {
    for (let i = 0; ; i++) {
      try { return await fn(); }
      catch (e) { if (!/429/.test(e.message) || i >= 4) throw e; await new Promise(r => setTimeout(r, 800 * 2 ** i)); }
    }
  } finally { active--; waiting.shift()?.(); }
}

// Ett "datumregister" per plats och grupp: { lat, lon, yr, t, gid, map, asked, done }.
// Datum räknas bara fram för de arter som visas (asked) och fylls på när listan expanderas.
let latestCache = [];
// compute=false: använd bara det som redan finns (inga nya anrop).
function latestFor(r, gid, keys, compute = true) {
  let e = r.latest[gid];
  if (!e) {
    e = latestCache.find(c => c.gid === gid && c.yr === r.yr && Date.now() - c.t < 30 * 60_000 && distKm(c, r) < 1);
    if (!e) {
      if (!compute) return null;
      e = { lat: r.lat, lon: r.lon, yr: r.yr, t: Date.now(), gid, map: {}, fresh: {}, asked: new Set(), done: Promise.resolve() };
      latestCache.unshift(e); latestCache = latestCache.slice(0, 12);
    }
    r.latest[gid] = e;
  }
  if (compute) {
    const need = keys.filter(k => !e.asked.has(k));
    if (need.length) {
      need.forEach(k => e.asked.add(k));
      e.done = Promise.all([e.done, findLatest(e, r, gid, need)]);
    }
  }
  return e;
}

async function findLatest(e, r, gid, keys) {
  const g = GROUPS[gid], leaves = dateLeaves();
  if (!leaves.length) return;
  // leaves[lo..hi] är sammanhängande: från leaves[hi].a (äldst) till leaves[lo].b (nyast)
  async function resolve(lo, hi, ks) {
    if (!ks.length) return;
    if (lo === hi) { ks.forEach(k => { e.map[k] = leaves[lo].label; if (leaves[lo].fresh) e.fresh[k] = leaves[lo].fresh; }); e.onProgress?.(); return; }
    const mid = (lo + hi) >> 1;
    const res = await throttled(() => facet(g, r.lat, r.lon, `&eventDate=${ymd(leaves[mid].a)},${ymd(leaves[lo].b)}`));
    const inNewer = new Set(res.counts.map(c => c.key));
    await Promise.all([resolve(lo, mid, ks.filter(k => inNewer.has(k))), resolve(mid + 1, hi, ks.filter(k => !inNewer.has(k)))]);
  }
  try {
    // Först hela perioden: arter utan datum i någon observation får inget datum (hamnar inte felaktigt i äldsta facket).
    const all = await throttled(() => facet(g, r.lat, r.lon, `&eventDate=${ymd(leaves.at(-1).a)},${ymd(leaves[0].b)}`));
    const dated = new Set(all.counts.map(c => c.key));
    await resolve(0, leaves.length - 1, keys.filter(k => dated.has(k)));
  } catch (err) {
    console.warn('Senaste datum:', err);
    keys.forEach(k => { if (!(k in e.map)) e.asked.delete(k); }); // försök igen nästa gång
  }
}

// ---- Visa vald plats och djurgrupp ----
function syncLabels() {
  const g = grp();
  $('countLabel').textContent = mode === 'explore' ? 'Arter vid vald punkt' : 'Arter i närheten';
  $('countLabel').parentNode.title = 'Inom 5 km';
  document.title = `Artappen · ${g.label}`;
}

async function renderCurrent() {
  const my = ++renderSeq;
  syncLabels();
  const r = viewRes();
  if (!r || r.yr !== yearId()) {
    $('count').textContent = ''; $('obsCount').textContent = '';
    const msg = mode === 'explore'
      ? (exploreAt ? 'Hämtar…' : 'Tryck på kartan för att utforska en plats.')
      : pos ? 'Hämtar…' : watchId != null ? 'Söker din position…' : 'Ingen position. Tillåt platstjänster, eller välj Utforska på kartan.';
    $('list').innerHTML = `<p class="empty">${esc(msg)}</p>`;
    setStatus(msg);
    return;
  }
  const gid = filter.group, g = grp();
  const { counts, total } = r.byGroup[gid];
  $('count').textContent = counts.length;
  $('obsCount').textContent = `${fmtN(total)} observationer`;
  const done = () => setStatus(datesPaused ? 'Datum pausade i fart' : '');
  await Promise.all(g.red.map(([n, k]) => loadRedlist(n, k).catch(e => console.warn('Rödlistan:', e))));
  if (my !== renderSeq) return;

  // Datum för senaste observation räknas inte fram i fart (> 15 km/h) – det kostar många anrop
  // och hinner knappt synas. De kommer tillbaka när du saktar in, och alltid i utforska-läget.
  const allowDates = mode === 'explore' || !isFast();
  const latest = latestFor(r, gid, shownKeys(counts), allowDates);
  datesPaused = !allowDates;
  const items = () => counts.map(c => ({ ...c, ...(names[c.key] || {}), last: latest?.map[c.key], fresh: latest?.fresh?.[c.key] }));
  renderList(items());
  if (latest) latest.onProgress = () => { if (my === renderSeq) renderList(items()); };

  const missing = counts.filter(c => !names[c.key]);
  let n = 0;
  await mapLimit(missing, 8, async c => {
    await speciesName(c.key);
    if (++n % 25 === 0 && my === renderSeq) { renderList(items()); setStatus(`Hämtar artnamn… ${n}/${missing.length}`); }
  });
  if (my !== renderSeq) return;
  renderList(items());
  done();
  if (selected) showSelection(false);
  if (!latest) return;
  await latest.done;
  if (my === renderSeq) renderList(items());
}

// ---- Fart ----
// GPS:ens egen fart om den finns, annars beräknad från positionerna den senaste halvminuten.
const FAST_KMH = 15;
let recentFixes = [], datesPaused = false;
function speedKmh() {
  const s = pos?.coords.speed;
  if (s != null && s >= 0) return s * 3.6;
  const now = recentFixes.at(-1), old = recentFixes.find(f => now && now.t - f.t <= 60_000);
  if (!now || !old || now.t - old.t < 20_000) return 0;
  return distKm(old, now) / ((now.t - old.t) / 3_600_000);
}
const isFast = () => speedKmh() > FAST_KMH;

// ---- Svenska rödlistan 2025 (GBIF-checklista) ----
const REDLIST_DS = '87e639cc-30a9-4007-bd2c-b0cab60326b9';
const THREAT = {
  CRITICALLY_ENDANGERED: { code: 'CR', sv: 'Akut hotad', rank: 3 },
  ENDANGERED:            { code: 'EN', sv: 'Starkt hotad', rank: 2 },
  VULNERABLE:            { code: 'VU', sv: 'Sårbar', rank: 1 },
};
let redlist = {};    // speciesKey -> hotkategori för hela arten (bara VU/EN/CR)
let redlistSsp = {}; // speciesKey -> { st, ssp } när bara en underart är bedömd
const redlistLoads = {};

function loadRedlist(cls, rank = 'CLASS') {
  return redlistLoads[cls] ??= (async () => {
    const cacheKey = `artappen.redlist.v3.${cls}`;
    const cached = load(cacheKey, null);
    if (cached && Date.now() - cached.t < 30 * 864e5) { Object.assign(redlist, cached.map); Object.assign(redlistSsp, cached.ssp); return; }
    const api = 'https://api.gbif.org/v1/species';
    const c = await fetch(`${api}/search?datasetKey=${REDLIST_DS}&q=${cls}&rank=${rank}&limit=1`).then(r => r.json());
    const classKey = c.results?.[0]?.key;
    if (!classKey) throw new Error(`hittade inte ${cls} i rödlistan`);
    const all = await fetch(`${api}/search?datasetKey=${REDLIST_DS}&highertaxonKey=${classKey}&limit=1000`).then(r => r.json());
    const map = {}, ssp = {};
    for (const r of all.results || []) {
      const st = (r.threatStatuses || []).find(t => THREAT[t]);
      if (!st || !r.nubKey) continue;
      if (r.rank === 'SPECIES') {
        if (!map[r.nubKey] || THREAT[st].rank > THREAT[map[r.nubKey]].rank) map[r.nubKey] = st;
      } else if (r.rank === 'SUBSPECIES') {
        // Bara underarten är bedömd (t.ex. sydlig kärrsnäppa) – arten lyfts inte fram, men märks.
        const s = await fetch(`${api}/${r.nubKey}`).then(x => x.json());
        if (s.speciesKey) ssp[s.speciesKey] = { st, ssp: (s.canonicalName || '').split(' ').slice(2).join(' ') };
      }
      // Populationer (t.ex. Östersjöns tumlare) hoppas över: kategorin gäller inte hela arten.
    }
    Object.assign(redlist, map); Object.assign(redlistSsp, ssp);
    save(cacheKey, { t: Date.now(), map, ssp });
  })().catch(e => { delete redlistLoads[cls]; throw e; });
}

// ---- Artlistan ----
function speciesRow(it, max) {
  const li = document.createElement('li');
  const fill = document.createElement('div');
  fill.className = 'barfill';
  fill.style.width = (it.n / max * 100) + '%';
  const name = document.createElement('span');
  name.className = 'nm';
  const th = THREAT[redlist[it.key]];
  const sub = !th && redlistSsp[it.key];
  if (th || sub) {
    const t = th || THREAT[sub.st];
    const b = document.createElement('b');
    b.className = 'badge ' + t.code.toLowerCase() + (sub ? ' ssp' : '');
    b.textContent = t.code;
    b.title = sub ? `${t.sv} gäller bara underarten ${sub.ssp}` : t.sv;
    name.appendChild(b);
  }
  if (isNewOnTrip(it.key)) {
    const nb = document.createElement('b');
    nb.className = 'badge new'; nb.textContent = 'NY'; nb.title = 'Ny på resan – fanns inte vid tidigare punkter';
    name.appendChild(nb);
  }
  name.append(it.swe || it.sci || '…');
  const pal = palettes[it.key];
  if (pal) {
    const mp = document.createElement('span');
    mp.className = 'minipal'; mp.title = 'Färgschema';
    mp.innerHTML = paletteHTML(pal.colors.slice(0, 6), 0.1);
    name.appendChild(mp);
  }
  const dt = document.createElement('span');
  // Färskt: idag fylld markering, senaste veckan grön text
  dt.className = 'dt' + (it.fresh ? ' ' + it.fresh : '');
  dt.textContent = it.last ? (it.fresh === 'today' ? 'sedd idag' : `senast ${it.last}`) : '';
  if (it.fresh) dt.title = it.fresh === 'today' ? 'Observerad idag' : 'Observerad den senaste veckan';
  name.appendChild(dt);
  const cnt = document.createElement('span');
  cnt.className = 'cnt'; cnt.textContent = fmtN(it.n);
  cnt.title = 'Antal observationer';
  const ib = document.createElement('button');
  ib.className = 'infobtn'; ib.textContent = 'i'; ib.title = 'Om arten'; ib.setAttribute('aria-label', 'Om arten');
  ib.onclick = e => { e.stopPropagation(); openInfo({ ...it, where: mode === 'explore' ? 'vid vald punkt' : 'inom 5 km' }); };
  li.append(fill, name, cnt, ib);
  li.dataset.key = it.key;
  li.title = `${it.sci ? it.sci + ' · ' : ''}tryck för att visa observationerna på kartan`;
  if (String(it.key) === String(selected?.key)) li.classList.add('sel');
  li.onclick = () => selectSpecies(it);
  return li;
}

const TOP_N = 20, TOP_RED = 10, EXPAND_KEY = 'artappen.expanded', EXPAND_RED_KEY = 'artappen.expandedRed';
let expanded = load(EXPAND_KEY, false), expandedRed = load(EXPAND_RED_KEY, false);
// Hotade arter: mest hotade först, sedan flest observationer.
const threatenedOf = items => items.filter(i => redlist[i.key])
  .sort((a, b) => THREAT[redlist[b.key]].rank - THREAT[redlist[a.key]].rank || b.n - a.n);
// Arterna som syns: de 20 vanligaste (eller alla) plus de 10 första hotade (eller alla).
function shownKeys(counts) {
  const keys = new Set(expanded ? counts.map(c => c.key) : counts.slice(0, TOP_N).map(c => c.key));
  const red = threatenedOf(counts);
  (expandedRed ? red : red.slice(0, TOP_RED)).forEach(c => keys.add(c.key));
  return [...keys];
}
function moreButton(total, open, onToggle, noun) {
  const b = document.createElement('button');
  b.className = 'more';
  b.textContent = open ? 'Visa färre' : `Visa alla ${total} ${noun}`;
  b.onclick = onToggle;
  return b;
}

function renderList(items) {
  const list = $('list');
  // Om två arter får samma svenska namn visas det latinska namnet efter, så att de går att skilja åt.
  const seen = {};
  items.forEach(i => { const n = (i.swe || '').toLowerCase(); if (n) seen[n] = (seen[n] || 0) + 1; });
  items = items.map(i => seen[(i.swe || '').toLowerCase()] > 1 && i.sci ? { ...i, swe: `${i.swe} (${i.sci})` } : i);
  if (!items.length) { list.innerHTML = `<p class="empty">Inga ${grp().none} inom 5 km (${yearText()}).</p>`; return; }
  const max = items[0].n;
  // Rödlistade arter står kvar på sin plats i listan (med etikett) och samlas dessutom under listan.
  const threatened = threatenedOf(items);
  const scroll = list.parentElement.scrollTop;
  list.innerHTML = '';
  const shown = expanded ? items : items.slice(0, TOP_N);
  const ol = document.createElement('ol');
  if (shown.length > 16) ol.className = 'two';
  shown.forEach(it => ol.appendChild(speciesRow(it, max)));
  list.appendChild(ol);
  if (items.length > TOP_N) list.appendChild(moreButton(items.length, expanded,
    () => { expanded = !expanded; save(EXPAND_KEY, expanded); renderCurrent(); }, 'arter'));
  if (threatened.length) {
    const box = document.createElement('div');
    box.className = 'redgroup';
    const h = document.createElement('h3');
    h.textContent = `Hotade arter · ${threatened.length} st (Rödlistan 2025)`;
    const redShown = expandedRed ? threatened : threatened.slice(0, TOP_RED);
    const rl = document.createElement('ol');
    if (redShown.length > 6) rl.className = 'two';
    redShown.forEach(it => rl.appendChild(speciesRow(it, max)));
    box.append(h, rl);
    if (threatened.length > TOP_RED) box.appendChild(moreButton(threatened.length, expandedRed,
      () => { expandedRed = !expandedRed; save(EXPAND_RED_KEY, expandedRed); renderCurrent(); }, 'hotade arter'));
    list.appendChild(box);
  }
  list.parentElement.scrollTop = scroll;
}

// ---- Resesammanfattning ----
// Alla arter som funnits inom 5 km från någon punkt på resan, per år-val och grupp:
// tripSpecies[yr][grupp][artnyckel] = flest observationer vid någon punkt. Inga extra anrop –
// det byggs av samma data som hämtas var 300:e meter.
const TRIP_KEY = 'artappen.tripSpecies', TOP_KEY = 'artappen.topMode';
let tripSpecies = load(TRIP_KEY, {});
let topMode = load(TOP_KEY, 'red');
// "Ny på resan": arter vid senaste punkten som inte fanns vid någon tidigare punkt.
let lastNew = null; // { yr, t, byGroup: { grupp: Set(artnycklar) } }
function collectTrip(r) {
  const firstPoint = !tripSpecies[r.yr];
  const bucket = tripSpecies[r.yr] ??= {};
  const byGroup = {};
  for (const [gid, { counts }] of Object.entries(r.byGroup)) {
    const g = bucket[gid] ??= {};
    byGroup[gid] = new Set(firstPoint ? [] : counts.filter(c => !(c.key in g)).map(c => c.key));
    counts.forEach(c => { g[c.key] = Math.max(g[c.key] || 0, c.n); });
  }
  lastNew = { yr: r.yr, t: r.t, byGroup };
  save(TRIP_KEY, tripSpecies);
}
const isNewOnTrip = key => tripOn && mode === 'gps' && tripRes && lastNew?.t === tripRes.t && lastNew.yr === yearId()
  && lastNew.byGroup[filter.group]?.has(String(key));

const SHORT = { mammals: 'däggdjur', birds: 'fåglar', herps: 'grod- & kräldjur' };
let allRedlists = null;
function loadAllRedlists() {
  return allRedlists ??= Promise.all(Object.values(GROUPS).flatMap(g => g.red.map(([n, k]) => loadRedlist(n, k).catch(() => {}))));
}

let tripRenderSeq = 0;
async function renderTrip() {
  const my = ++tripRenderSeq;
  const bucket = tripSpecies[yearId()] || {};
  const all = Object.entries(bucket).flatMap(([gid, sp]) => Object.entries(sp).map(([key, n]) => ({ gid, key, n })));
  const tr = track.filter(p => p.yr === yearId());
  if (!all.length) {
    $('tripSummary').innerHTML = `<div class="parts">Ingen resa ${tr.length || track.length ? 'med valda år' : 'än'}. Starta en resa för att samla arter längs vägen.</div>`;
    $('topList').innerHTML = '<li class="muted">Topplistan fylls på under resan.</li>';
    document.querySelectorAll('#topSeg button').forEach(b => b.classList.toggle('on', b.dataset.top === topMode));
    return;
  }
  await loadAllRedlists();
  if (my !== tripRenderSeq) return;
  // Sammanfattning
  const per = Object.keys(GROUPS).map(gid => [gid, Object.keys(bucket[gid] || {}).length]).filter(([, n]) => n);
  const red = all.filter(x => redlist[x.key]);
  const newCount = lastNew && lastNew.yr === yearId() ? Object.values(lastNew.byGroup).reduce((s, x) => s + x.size, 0) : 0;
  let km = 0; for (let i = 1; i < tr.length; i++) km += distKm(tr[i - 1], tr[i]);
  const mins = tr.length > 1 ? Math.round((tr.at(-1).t - tr[0].t) / 60_000) : 0;
  const dur = mins >= 60 ? `${Math.floor(mins / 60)} h ${mins % 60} min` : `${mins} min`;
  $('tripSummary').innerHTML =
    `<div class="big">${fmtN(all.length)} <span>arter längs resan</span></div>` +
    `<div class="groups">${per.map(([gid, n]) => `<span><b>${fmtN(n)}</b> ${SHORT[gid]}</span>`).join('')}` +
    `${red.length ? `<span><b>${fmtN(red.length)}</b> hotade</span>` : ''}</div>` +
    `<div class="parts">${[`${km.toFixed(1).replace('.', ',')} km`, dur, `${tr.length} mätningar`, yearText()].map(x => `<span>${x}</span>`).join('')}</div>` +
    (newCount ? `<div class="newline">${newCount} nya arter vid senaste punkten</div>` : '');
  // Topplista: alla grupper i samma lista
  const sorted = topMode === 'red'
    ? red.sort((a, b) => THREAT[redlist[b.key]].rank - THREAT[redlist[a.key]].rank || a.n - b.n)
    : topMode === 'rare' ? [...all].sort((a, b) => a.n - b.n) : [...all].sort((a, b) => b.n - a.n);
  const top = sorted.slice(0, 10);
  const draw = () => {
    if (my !== tripRenderSeq) return;
    document.querySelectorAll('#topSeg button').forEach(b => b.classList.toggle('on', b.dataset.top === topMode));
    $('topList').innerHTML = top.length ? top.map((x, i) => {
      const nm = names[x.key], th = THREAT[redlist[x.key]];
      return `<li data-key="${x.key}" data-i="${i}" title="${esc(nm?.sci || '')} – tryck för mer om arten"><span class="rank">${i + 1}</span><img src="img/${x.gid}.png" alt="${esc(GROUPS[x.gid].label)}">` +
        `<span class="nm">${th ? `<b class="badge ${th.code.toLowerCase()}" title="${th.sv}">${th.code}</b>` : ''}${esc(nm?.swe || nm?.sci || '…')}</span>` +
        `<span class="cnt">${fmtN(x.n)} obs.</span></li>`;
    }).join('') : '<li class="muted">Inga hotade arter längs resan än.</li>';
  };
  draw();
  $('topList').onclick = e => {
    const li = e.target.closest('li[data-key]'); if (!li) return;
    const x = top[+li.dataset.i];
    openInfo({ key: x.key, n: x.n, ...(names[x.key] || {}), gid: x.gid, where: 'längs resan (max vid en punkt)' });
  };
  const missing = top.filter(x => !names[x.key]);
  if (missing.length) { await Promise.all(missing.map(x => speciesName(x.key))); draw(); }
}

// ---- Informationskort: bild och text om arten ----
// Som Plex: GBIF-nyckeln slås upp i Wikidata, som länkar vidare till svenska Wikipedia (text),
// Wikimedia Commons (bild med fotograf och licens), Dyntaxa (Artfakta) och xeno-canto (läten).
// Allt hämtas direkt från webbläsaren utan nycklar och sparas i telefonen i 30 dagar.
const INFO_KEY = 'artappen.info.v1';
const infoCache = load(INFO_KEY, {});
const qs = p => new URLSearchParams({ ...p, format: 'json', origin: '*' });
const plain = html => new DOMParser().parseFromString(html || '', 'text/html').body.textContent.trim();

async function speciesInfo(key, sci) {
  const hit = infoCache[key];
  if (hit && Date.now() - hit.t < 30 * 864e5) return hit;
  const WD = 'https://www.wikidata.org/w/api.php';
  const find = async q => (await fetch(`${WD}?${qs({ action: 'query', list: 'search', srsearch: q, srlimit: 1 })}`).then(r => r.json())).query?.search?.[0]?.title;
  // 1) GBIF-nyckel → Wikidata (annars via vetenskapligt namn)
  let qid = await find(`haswbstatement:P846=${key}`);
  if (!qid && sci) qid = await find(`haswbstatement:"P225=${sci}"`);
  const info = { t: Date.now(), qid };
  if (qid) {
    const e = Object.values((await fetch(`${WD}?${qs({ action: 'wbgetentities', ids: qid, props: 'sitelinks|claims', sitefilter: 'svwiki' })}`).then(r => r.json())).entities)[0];
    const claim = p => e.claims?.[p]?.[0]?.mainsnak?.datavalue?.value;
    Object.assign(info, { wiki: e.sitelinks?.svwiki?.title, image: claim('P18'), dyntaxa: claim('P1939'), xc: claim('P2426') });
  }
  // 2) Kort text från svenska Wikipedia
  if (info.wiki) {
    const d = await fetch(`https://sv.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(info.wiki)}`).then(r => r.ok ? r.json() : null).catch(() => null);
    if (d?.extract) { info.text = d.extract; info.wikiUrl = d.content_urls?.desktop?.page; }
    if (!info.image && d?.originalimage?.source) info.image = decodeURIComponent(d.originalimage.source.split('/').pop());
  }
  // 3) Bild från Wikimedia Commons, med fotograf och licens
  if (info.image) {
    const d = await fetch(`https://commons.wikimedia.org/w/api.php?${qs({ action: 'query', titles: `File:${info.image}`, prop: 'imageinfo',
      iiprop: 'url|extmetadata', iiurlwidth: 800, iiextmetadatafilter: 'Artist|LicenseShortName|LicenseUrl' })}`).then(r => r.json()).catch(() => null);
    const ii = d && Object.values(d.query?.pages || {})[0]?.imageinfo?.[0];
    if (ii) info.img = { src: ii.thumburl || ii.url, page: ii.descriptionurl, artist: plain(ii.extmetadata?.Artist?.value) || 'okänd',
                         license: ii.extmetadata?.LicenseShortName?.value || '', licenseUrl: ii.extmetadata?.LicenseUrl?.value || '' };
  }
  infoCache[key] = info; save(INFO_KEY, infoCache);
  return info;
}

  if (my !== infoSeq) return;
  const img = info.img ? `<figure class="info-img"><img src="${esc(info.img.src)}" alt="${esc(name)}">` +
    `<figcaption class="credit">Foto: <a href="${esc(info.img.page)}" target="_blank" rel="noopener">${esc(info.img.artist)}</a>` +
    `${info.img.license ? ` · ${info.img.licenseUrl ? `<a href="${esc(info.img.licenseUrl)}" target="_blank" rel="noopener">${esc(info.img.license)}</a>` : esc(info.img.license)}` : ''} · Wikimedia Commons</figcaption></figure>` : '';
  const text = info.text
    ? `<p class="info-text">${esc(info.text)}</p><div class="info-src">Text: <a href="${esc(info.wikiUrl)}" target="_blank" rel="noopener">svenska Wikipedia</a> · <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.sv" target="_blank" rel="noopener">CC BY-SA 4.0</a></div>`
    : '<p class="info-text muted">Ingen artikel på svenska Wikipedia hittades.</p>';
  const links = [
    mapBtn,
    info.wikiUrl ? `<a href="${esc(info.wikiUrl)}" target="_blank" rel="noopener">Wikipedia</a>` : '',
    info.dyntaxa ? `<a href="https://artfakta.se/taxa/${esc(info.dyntaxa)}" target="_blank" rel="noopener">Artfakta</a>` : '',
    info.xc ? `<a href="https://xeno-canto.org/species/${esc(info.xc)}" target="_blank" rel="noopener">Lyssna på xeno-canto</a>` : '',
  ].filter(Boolean).join('');
  const pal = palettes[it.key];
  const palBlock = pal ? `<div class="pal-row"><img class="sprite" src="${esc(pal.sprite)}" alt="Pixelfigur av ${esc(name)}">` +
    `<div class="palette" title="Färgschema">${paletteHTML(pal.colors)}</div></div>` +
    `<div class="pal-credit">Färgschema och pixelfigur ur foto av <a href="${esc(pal.credit.page)}" target="_blank" rel="noopener">${esc(pal.credit.artist)}</a>` +
    ` · ${esc(pal.credit.license)}</div>` : '';
  $('infoBody').innerHTML = img + head + palBlock + text + (links ? `<div class="info-links">${links}</div>` : '');
  $('infoMap')?.addEventListener('click', () => { closeInfo(); if (String(selected?.key) !== String(it.key)) selectSpecies(it); else scrollToMap(); });
}

// ---- Kurva över resan ----
function drawChart() {
  const svg = $('chart');
  const W = Math.max(svg.clientWidth, 100), H = Math.max(svg.clientHeight, 50), P = { l: 30, r: 6, t: 8, b: 18 };
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const yr = yearId(), gid = filter.group;
  const tr = track.filter(p => p.yr === yr && p.n?.[gid] != null);
  if (tr.length < 1) { svg.innerHTML = ''; $('chartInfo').textContent = `Fylls på var 300:e meter när resan är igång.`; return; }
  let d = 0; const pts = tr.map((p, i) => { if (i) d += distKm(tr[i - 1], p); return { x: d, y: p.n[gid] }; });
  const maxX = Math.max(pts.at(-1).x, 0.001), maxY = Math.max(...pts.map(p => p.y), 1);
  const useIndex = pts.at(-1).x < 0.05; // står still → använd mätpunkt som x
  const X = (p, i) => P.l + (useIndex ? (tr.length > 1 ? i / (tr.length - 1) : 0.5) : p.x / maxX) * (W - P.l - P.r);
  const Y = y => H - P.b - (y / maxY) * (H - P.t - P.b);
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p, i).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');
  const css = getComputedStyle(document.documentElement);
  const accent = css.getPropertyValue('--accent'), muted = css.getPropertyValue('--muted'), line = css.getPropertyValue('--line');
  svg.innerHTML = `
    <line x1="${P.l}" y1="${H - P.b}" x2="${W - P.r}" y2="${H - P.b}" stroke="${line}"/>
    <line x1="${P.l}" y1="${Y(maxY)}" x2="${W - P.r}" y2="${Y(maxY)}" stroke="${line}" stroke-dasharray="3 3"/>
    <text x="${P.l - 5}" y="${Y(maxY) + 4}" text-anchor="end" font-size="10" fill="${muted}">${maxY}</text>
    <text x="${P.l - 5}" y="${H - P.b + 4}" text-anchor="end" font-size="10" fill="${muted}">0</text>
    <text x="${W - P.r}" y="${H - 4}" text-anchor="end" font-size="10" fill="${muted}">${useIndex ? tr.length + ' mätningar' : maxX.toFixed(1) + ' km'}</text>
    <path d="${path}" fill="none" stroke="${accent}" stroke-width="2.2" stroke-linejoin="round"/>
    ${tr.length < 60 ? pts.map((p, i) => `<circle cx="${X(p, i)}" cy="${Y(p.y)}" r="2.5" fill="${accent}"/>`).join('') : ''}`;
  $('chartInfo').textContent = `${grp().label} · ${tr.length} mätningar sedan ${clock(tr[0].t)} · ${pts.at(-1).x.toFixed(1)} km`;
}

const obsUrl = () => `https://api.gbif.org/v2/map/occurrence/adhoc/{z}/{x}/{y}@1x.png?datasetKey=${DATASET}${taxonParam(grp())}${yearParam()}&style=classic.poly&bin=hex&hexPerTile=30&srs=EPSG:3857`;
const OBS_OPACITY = 0.35;
// GBIF:s kartserver svarar ibland 503 (överbelastad) med en bild där felkoden står i stora röda siffror.
// Därför hämtas rutorna med fetch: bara svar som är OK visas, annars försöker den igen lite senare
// och lämnar annars rutan tom.
const BLANK = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
const SafeTiles = L.TileLayer.extend({
  createTile(coords, done) {
    const img = document.createElement('img');
    img.alt = ''; img.setAttribute('role', 'presentation');
    const url = this.getTileUrl(coords);
    const attempt = n => fetch(url).then(r => r.ok ? r.blob() : Promise.reject(r.status)).then(b => {
      const u = URL.createObjectURL(b);
      img.onload = () => { URL.revokeObjectURL(u); done(null, img); };
      img.onerror = () => { img.onerror = null; img.src = BLANK; done(null, img); };
      img.src = u;
    }).catch(() => {
      if (n < 2 && img.isConnected !== false) setTimeout(() => attempt(n + 1), 3000 * (n + 1) + Math.random() * 2000);
      else { img.onload = () => done(null, img); img.src = BLANK; }
    });
    attempt(0);
    return img;
  }
});
const obsLayer = new SafeTiles(obsUrl(), { maxZoom: 19, opacity: OBS_OPACITY }).addTo(map);

const exploreDot = L.circleMarker([0, 0], { radius: 7, color: '#fff', weight: 2.5, fillColor: css('--explore'), fillOpacity: 1, interactive: false });

  d.innerHTML = '<button data-mode="gps">Min position</button><button data-mode="explore">Utforska</button>';
  L.DomEvent.disableClickPropagation(d);
  d.onclick = e => { const b = e.target.closest('button'); if (b) setMode(b.dataset.mode); };
  return d;
};
modeCtl.addTo(map);

// Knapp under zoom: centrera på det som visas
const recenter = L.control({ position: 'topleft' });
recenter.onAdd = () => {
  const d = L.DomUtil.create('div', 'leaflet-bar');
  d.innerHTML = '<a href="#" title="Centrera" role="button" style="font-size:16px">◎</a>';
  L.DomEvent.disableClickPropagation(d);
  d.firstChild.onclick = e => { e.preventDefault(); fitView(); };
  return d;
};
recenter.addTo(map);

// Infoskylt längst ner till vänster (markerad art eller tips i utforska-läget)
const hint = L.control({ position: 'bottomleft' });
hint.onAdd = () => { const d = L.DomUtil.create('div', 'maphint'); L.DomEvent.disableClickPropagation(d); return d; };
function showHint(html) {
  if (!html) { hint.remove(); return; }
  hint.addTo(map); hint.getContainer().innerHTML = html;
}

// Kartan zoomas aldrig om automatiskt (cirkeln är alltid 5 km) – den flyttas bara.
// Zoomen styr man själv. Enda undantaget: första gången en position visas från Sverige-översikten.
// Kartan zoomas så att hela 5 km-ringen precis syns: när en position visas första gången,
// när man byter läge, väljer en punkt att utforska eller trycker på ◎. Annars flyttas den bara.
function fitRing(lat, lon) {
  map.fitBounds(L.latLng(lat, lon).toBounds(RADIUS_KM * 2000), { padding: [10, 10] });
}
function fitView() {
  if (mode === 'explore' && exploreAt) { fitRing(exploreAt.lat, exploreAt.lon); return; }
  if (mode === 'gps' && pos) { follow = true; fitRing(pos.coords.latitude, pos.coords.longitude); }
}

function setMode(m) {
  if (m === mode) { fitView(); return; }
  mode = m;
  document.querySelectorAll('.mapseg button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  $('map').classList.toggle('exploring', mode === 'explore');
  if (selected) clearSelection(false);
  if (mode === 'explore') {
    follow = false;
    if (exploreAt) { exploreDot.addTo(map); exploreCircle.addTo(map); fitRing(exploreAt.lat, exploreAt.lon); }
    showHint(exploreAt ? null : 'Tryck på kartan där du vill utforska.');
  } else {
    showHint(null);
    exploreDot.remove(); exploreCircle.remove();
    if (pos) { follow = true; fitRing(pos.coords.latitude, pos.coords.longitude); }
  }
  renderCurrent();
}

map.on('click', e => {
  if (mode !== 'explore') return;
  exploreAt = { lat: e.latlng.lat, lon: e.latlng.lng };
  exploreDot.setLatLng(e.latlng).addTo(map);
  exploreCircle.setLatLng(e.latlng).addTo(map);
  fitRing(e.latlng.lat, e.latlng.lng);
  showHint(null);
  if (selected) clearSelection(false);
  exploreFetch();
});

function drawTrack() { trackLine.setLatLngs(track.map(p => [p.lat, p.lon])); }

function showPosition(p) {
  const ll = [p.coords.latitude, p.coords.longitude];
  me.setLatLng(ll).addTo(map);
  accCircle.setLatLng(ll).setRadius(p.coords.accuracy).addTo(map);
  radiusCircle.setLatLng(ll).addTo(map);
  if (mode !== 'gps') return;
  if (!centered) { fitRing(...ll); centered = true; }
  else if (follow) map.panTo(ll);
}

// ---- Markerad art: visa dess observationer på kartan ----
let selected = null, selSeq = 0;
const selLayer = L.layerGroup().addTo(map);

function markRows() {
  document.querySelectorAll('#list li[data-key]').forEach(li => li.classList.toggle('sel', li.dataset.key === String(selected?.key)));
}
function clearSelection(refit = true) {
  selected = null; selSeq++;
  selLayer.clearLayers();
  showHint(mode === 'explore' && !exploreAt ? 'Tryck på kartan där du vill utforska.' : null);
  obsLayer.setOpacity(OBS_OPACITY);
  markRows();
  if (refit) fitView();
}
function selectSpecies(it) {
  if (String(selected?.key) === String(it.key)) { clearSelection(); return; }
  selected = { key: it.key, name: it.swe || it.sci || 'Arten' };
  markRows();
  showSelection(true);
  scrollToMap();
}

// I mobilen ligger kartan under listan: skrolla ner till kartan.
function scrollToMap() {
  if (!matchMedia('(max-width: 899px)').matches) return;
  const top = document.querySelector('.mapcard').getBoundingClientRect().top + scrollY
            - 8;
  scrollTo({ top, behavior: 'smooth' });
}

async function showSelection(fit) {
  const at = viewPoint();
  if (!selected || !at) return;
  const my = ++selSeq;
  showHint(`<b>${esc(selected.name)}</b> · hämtar…`);
  const base = `${OCC}?datasetKey=${DATASET}&speciesKey=${selected.key}` +
    `&geoDistance=${at.lat},${at.lon},${RADIUS_KM}km${yearParam()}&hasCoordinate=true&limit=300`;
  let recs = [], total = 0;
  try {
    for (let off = 0; off < 1500; off += 300) {
      const d = await fetch(`${base}&offset=${off}`).then(r => r.json());
      if (my !== selSeq) return;
      total = d.count; recs.push(...d.results);
      if (d.endOfRecords) break;
    }
  } catch (e) { showHint(`<b>${esc(selected.name)}</b> · kunde inte hämta`); return; }
  selLayer.clearLayers();
  obsLayer.setOpacity(0.12);
  const color = css('--sel');
  for (const r of recs) {
    const id = (r.occurrenceID || '').split(':').pop();
    const date = (r.eventDate || '').slice(0, 10) || r.year || 'okänt datum';
    const html = `<b>${esc(selected.name)}</b><br>${esc(date)}` +
      (r.individualCount ? ` · ${esc(r.individualCount)} st` : '') +
      (r.locality ? `<br>${esc(r.locality)}` : '') +
      (r.coordinateUncertaintyInMeters ? `<br>±${Math.round(r.coordinateUncertaintyInMeters)} m` : '') +
      (/^\d+$/.test(id) ? `<br><a href="https://www.artportalen.se/Sighting/${id}" target="_blank" rel="noopener">Visa i Artportalen</a>` : '');
    L.circleMarker([r.decimalLatitude, r.decimalLongitude], {
      radius: 5.5, color: '#fff', weight: 1.2, fillColor: color, fillOpacity: 0.85, bubblingMouseEvents: false
    }).bindPopup(html).addTo(selLayer);
  }
  const shown = recs.length < total ? `${fmtN(recs.length)} av ${fmtN(total)}` : fmtN(total);
  showHint(`<b>${esc(selected.name)}</b> · ${shown} obs.<button title="Avmarkera">✕</button>`);
  hint.getContainer().querySelector('button').onclick = () => clearSelection();
  if (fit && recs.length) {
    follow = false;
    map.panTo([at.lat, at.lon]);
  }
}

// ---- Resan: GPS, när den ska hämta, och skydd mot felaktiga positioner ----
function movedSinceFetch() {
  if (!pos || !lastFetch) return 0;
  return distKm(lastFetch, { lat: pos.coords.latitude, lon: pos.coords.longitude }) * 1000;
}
function maybeUpdate() {
  if (!pos) return;
  if (!lastFetch) { update(); return; }
  const since = Date.now() - lastFetch.t;
  const needed = Math.max(tripOn ? MOVE_M : HOME_MOVE_M, pos.coords.accuracy || 0);
  if (movedSinceFetch() >= needed && since >= MIN_GAP_MS) update();
  else showProgress();
}
function showProgress() {
  if (!pos || !lastFetch || !tripOn) return;
  const needed = Math.max(MOVE_M, pos.coords.accuracy || 0);
  const left = Math.max(0, Math.round(needed - movedSinceFetch()));
  setGps(`Skannar längs vägen · GPS ±${Math.round(pos.coords.accuracy)} m\nNästa skanning om ${left} m`);
}

// Har GBIF fått in ny data från Artportalen sedan vi hämtade? Då hämtas allt om, annars inget.
let gbifStamp = load('artappen.gbifStamp', null);
async function checkFresh() {
  if (document.visibilityState !== 'visible') return;
  try {
    const d = await fetch(`https://api.gbif.org/v1/dataset/${DATASET}/process?limit=5`).then(r => r.json());
    const stamp = d.results.find(x => x.finishReason === 'NORMAL')?.finishedCrawling;
    if (!stamp || stamp === gbifStamp) return;
    const changed = gbifStamp !== null;
    gbifStamp = stamp; save('artappen.gbifStamp', stamp);
    if (!changed) return;
    if (pos) { lastFetch = null; maybeUpdate(); }
    if (exploreAt) exploreFetch();
  } catch {}
}
setInterval(checkFresh, FRESH_CHECK_MS);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkFresh(); });
checkFresh();

// Radarkänsla i resläget: ringen pulserar svagt och blinkar till vid varje skanning.
function scanFlash() {
  const el = radiusCircle.getElement?.(); if (!el) return;
  el.classList.remove('scanned'); void el.getBoundingClientRect(); el.classList.add('scanned');
}

// 1) För osäkra positioner (t.ex. IP-baserad gissning) används inte.
// 2) Ett hopp som kräver orimlig fart räknas som fel – tills flera positioner i rad bekräftar det.
const MAX_ACC_M = 1500, MAX_KMH = 250;
const CONFIRM_FIXES = 3, CONFIRM_RADIUS_M = 500, CONFIRM_MS = 20_000;
let candidates = [];
function checkFix(p) {
  const c = p.coords;
  if (c.accuracy > MAX_ACC_M) return { ok: false, why: `för osäker position (±${(c.accuracy / 1000).toFixed(1)} km)` };
  if (!pos) return { ok: true };
  const here = { lat: c.latitude, lon: c.longitude };
  const km = distKm({ lat: pos.coords.latitude, lon: pos.coords.longitude }, here);
  const h = Math.max((p.timestamp - pos.timestamp) / 3_600_000, 1 / 3600);
  const effKm = Math.max(0, km - (c.accuracy + pos.coords.accuracy) / 1000);
  if (effKm / h <= MAX_KMH) { candidates = []; return { ok: true }; }
  candidates = candidates.filter(q => distKm(q, here) * 1000 <= CONFIRM_RADIUS_M);
  candidates.push({ ...here, t: p.timestamp });
  if (candidates.length >= CONFIRM_FIXES && p.timestamp - candidates[0].t >= CONFIRM_MS) { candidates = []; return { ok: true }; }
  return { ok: false, why: `orimligt hopp på ${km.toFixed(1)} km – väntar på bekräftelse (${candidates.length}/${CONFIRM_FIXES})` };
}

let first = true;
function onFix(p) {
  const chk = checkFix(p);
  if (!chk.ok) {
    rejectCircle.setLatLng([p.coords.latitude, p.coords.longitude]).setRadius(p.coords.accuracy).addTo(map);
    setGps(`Ignorerar position: ${chk.why}.${pos ? '' : ' Under tiden kan du utforska kartan.'}`, true);
    return;
  }
  rejectCircle.remove();
  pos = p;
  recentFixes.push({ lat: p.coords.latitude, lon: p.coords.longitude, t: p.timestamp });
  recentFixes = recentFixes.filter(f => p.timestamp - f.t <= 60_000);
  showPosition(p);
  if (first) { first = false; timer ??= setInterval(maybeUpdate, 5_000); update(); }
  else maybeUpdate();
  if (datesPaused && mode === 'gps' && !isFast()) renderCurrent(); // saktat in: visa datumen igen
}

// Håll skärmen tänd medan resan pågår – webbläsaren får ingen position när skärmen är släckt.
let wakeLock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && document.visibilityState === 'visible') wakeLock = await navigator.wakeLock.request('screen'); } catch {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && tripOn) keepAwake(); });

function setTripButton(running) {
  const b = $('startBtn');
  b.textContent = running ? 'Avsluta resa' : 'Starta resa';
  b.classList.toggle('primary', !running);
  b.classList.toggle('stop', running);
}

function setTripView(on) {
  tripView = on; save(TRIPVIEW_KEY, on);
  document.body.classList.toggle('tripview', on);
  document.body.classList.toggle('triprun', tripOn);
  $('tripShow').hidden = on || !track.length;
  requestAnimationFrame(() => { map.invalidateSize(); drawChart(); });
}

// Följ positionen (alltid, även utan resa). Webbläsaren frågar om lov första gången.
function locate() {
  if (watchId != null) return;
  if (!('geolocation' in navigator)) { setGps('Webbläsaren saknar platsstöd. Du kan utforska kartan i stället.', true); return; }
  if (!pos) setStatus('Söker din position…');
  watchId = navigator.geolocation.watchPosition(onFix, err => {
    const why = err.code === 1 ? 'webbläsaren fick inte använda platstjänster' : err.message;
    if (watchId != null) navigator.geolocation.clearWatch(watchId);
    watchId = null; first = true;
    if (tripOn) stop();
    setGps(`Positionsfel: ${why}.`, true);
    if (!pos) renderCurrent();
  }, { enableHighAccuracy: true, maximumAge: 5_000, timeout: 60_000 });
}

function start() {
  tripOn = true;
  setTripView(true);
  keepAwake();
  setTripButton(true);
  setGps(pos ? 'Resan har startat.' : 'Söker din position… (första gången frågar webbläsaren om lov)');
  locate();
  if (pos) { if (mode !== 'gps') setMode('gps'); update(); }
}

// Avsluta resan: positionen följs vidare som vanligt, men inga fler punkter sparas.
// Resan och kurvan finns kvar tills man rensar.
function stop() {
  tripOn = false;
  candidates = [];
  wakeLock?.release().catch(() => {}); wakeLock = null;
  setTripButton(false);
  document.body.classList.remove('triprun');
  let km = 0; for (let i = 1; i < track.length; i++) km += distKm(track[i - 1], track[i]);
  setGps(track.length ? `Resan avslutad · ${track.length} mätningar · ${km.toFixed(1)} km\nStarta igen för att fortsätta, eller rensa för att börja om.`
                      : 'Resan avslutad.');
  renderCurrent(); // ta bort NY-märkningen
}

// ---- Filter: djurgrupp och år ----
function fillYears() {
  const opts = first => [`<option value="">${first}</option>`]
    .concat(Array.from({ length: THIS_YEAR - FIRST_YEAR + 1 }, (_, i) => THIS_YEAR - i).map(y => `<option>${y}</option>`)).join('');
  $('yearFrom').innerHTML = opts('tidigast');
  $('yearTo').innerHTML = opts('senast');
}
function syncControls() {
  document.querySelectorAll('#groupSeg button').forEach(b => b.classList.toggle('on', b.dataset.group === filter.group));
  $('yearFrom').value = filter.from ?? '';
  $('yearTo').value = filter.to ?? '';
  let chipOn = false;
  document.querySelectorAll('#yearChips button[data-span]').forEach(b => {
    const span = +b.dataset.span;
    const on = span === 0 ? (!filter.from && !filter.to) : (filter.from === THIS_YEAR - span + 1 && !filter.to);
    b.classList.toggle('on', on); chipOn ||= on;
  });
  // "Välj" visar det egna intervallet när inget snabbval passar, t.ex. "2015–2020"
  const pick = $('yearPickBtn');
  pick.classList.toggle('on', !chipOn);
  pick.textContent = chipOn ? 'Välj' : (filter.from && filter.to && filter.from === filter.to ? `${filter.from}` : `${filter.from ?? ''}–${filter.to ?? ''}`);
  document.querySelectorAll('.mapseg button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  syncLabels();
}
function applyFilter() {
  if (filter.from && filter.to && filter.from > filter.to) [filter.from, filter.to] = [filter.to, filter.from];
  save(FILTER_KEY, filter);
  syncControls();
  obsLayer.setUrl(obsUrl());
  drawChart(); renderTrip();
  // Byte av djurgrupp: allt finns redan hämtat. Byte av år: hämta om för resa och utforskad punkt.
  if (tripRes && tripRes.yr !== yearId() && pos) update();
  if (exploreRes && exploreRes.yr !== yearId() && exploreAt) exploreFetch();
  renderCurrent();
}

$('groupSeg').onclick = e => {
  const b = e.target.closest('button');
  if (b && b.dataset.group !== filter.group) { if (selected) clearSelection(false); filter.group = b.dataset.group; applyFilter(); }
};
function showYearPick(open) {
  $('yearPick').hidden = !open;
  $('yearPickBtn').setAttribute('aria-expanded', open);
}
$('yearPickDone').onclick = () => showYearPick(false);
document.addEventListener('click', e => { if (!e.target.closest('.yearwrap')) showYearPick(false); });
$('yearChips').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'yearPickBtn') { showYearPick($('yearPick').hidden); return; }
  showYearPick(false);
  const span = +b.dataset.span;
  filter.from = span ? THIS_YEAR - span + 1 : null; filter.to = null;
  applyFilter();
};
$('yearFrom').onchange = e => { filter.from = e.target.value ? +e.target.value : null; applyFilter(); };
$('yearTo').onchange = e => { filter.to = e.target.value ? +e.target.value : null; applyFilter(); };
$('startBtn').onclick = () => tripOn ? stop() : start();
$('tripHide').onclick = () => setTripView(false);
$('tripShow').onclick = () => setTripView(true);
$('clearBtn').onclick = () => {
  if (track.length && !confirm('Rensa hela resan, kurvan och topplistan?')) return;
  track = []; save(TRACK_KEY, track);
  tripSpecies = {}; save(TRIP_KEY, tripSpecies); lastNew = null;
  drawChart(); drawTrack(); renderTrip();
  if (!tripOn) setTripView(false);
};
$('topSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  topMode = b.dataset.top; save(TOP_KEY, topMode); renderTrip();
};

fillYears();
setTripView(tripView && track.length > 0);
syncControls();
renderCurrent();
drawChart();
drawTrack();
renderTrip();
if (tripView && track.length) map.fitBounds(trackLine.getBounds().pad(0.3), { maxZoom: 12 }); // en kort resa ska inte ge maxzoom
new ResizeObserver(() => map.invalidateSize()).observe($('map'));
new ResizeObserver(() => drawChart()).observe($('chart'));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(e => console.warn('Service worker:', e));
// Appen visar arterna där du är direkt – resan startar man själv.
locate();
</script>
</body>
</html>
