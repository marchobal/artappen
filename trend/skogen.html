<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>Skogen · Artappen</title>
<style>
  :root { --bg: #05070d; --text: #e8ecf5; --muted: #8d97ad; --border: #8fa6c8; --accent: #5ab4ff;
    --panel: rgba(8, 12, 22, 0.8); --down: #ffb070; --up: #8fdc8f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #scene { position: absolute; inset: 0; touch-action: none; }
  .head { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 16px; z-index: 5; }
  .back { color: var(--muted); font-size: 13px; text-decoration: none; }
  /* allt i bilden: texter och fåglar sitter fast i landskapet och följer med när kameran rör sig */
  #lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
  #labels { position: absolute; inset: 0; pointer-events: none; z-index: 4; overflow: hidden; }
  .lab { position: absolute; left: 0; top: 0; opacity: 0; will-change: transform, opacity; }
  .lab.title { font-size: 22px; font-weight: 650; color: #fff; white-space: nowrap; letter-spacing: 0.2px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.95), 0 0 2px #000; }
  .lab.fact { background: rgba(6,10,18,0.74); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 10px; padding: 6px 10px; font-size: 13px; line-height: 1.35;
    width: max-content; max-width: 210px; }
  .lab.fact b { font-size: 20px; color: #ffc27a; font-variant-numeric: tabular-nums; }
  .lab .sub { display: block; opacity: 0; max-height: 0; transition: opacity 0.7s, max-height 0.7s; overflow: hidden; }
  .lab .sub.on { opacity: 1; max-height: 80px; }
  .flock { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; width: max-content; }
  .flock .hd { font-size: 11px; color: #cfd6e4; padding-left: 4px; text-shadow: 0 1px 6px #000; }
  .chip { display: flex; align-items: center; gap: 6px; background: rgba(6,10,18,0.78); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px; padding: 3px 10px 3px 5px; font-size: 12.5px; opacity: 0; transform: translateY(8px) scale(0.9);
    transition: opacity 0.5s, transform 0.5s; }
  .chip.on { opacity: 1; transform: none; }
  .chip svg { width: 22px; height: 22px; color: #e8ecf5; flex: none; }
  .chip .n { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; }
  .chip.down .n { color: var(--down); } .chip.up .n { color: var(--up); }
  .flock .ft { font-size: 10.5px; color: #aeb7c8; max-width: 190px; text-shadow: 0 1px 6px #000; padding-left: 4px;
    opacity: 0; transition: opacity 0.7s; }
  .flock .ft.on { opacity: 1; }
  .year { position: absolute; right: 18px; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 62px); z-index: 5;
    color: var(--border); font-size: 26px; letter-spacing: 0.5px; font-variant-numeric: tabular-nums; }
  .legend { position: absolute; left: 16px; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 62px); z-index: 5;
    display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--muted); max-width: calc(100% - 120px); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .bar { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom));
    z-index: 5; display: flex; gap: 8px; align-items: center; background: var(--panel); backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.08); border-radius: 999px; padding: 6px; }
  button { font: inherit; color: var(--text); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; white-space: nowrap; }
  .dots { display: flex; gap: 6px; padding: 0 4px; }
  .dots span { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.22); cursor: pointer; }
  .dots span.on { background: var(--accent); }
  .credit { position: absolute; right: 12px; top: max(10px, env(safe-area-inset-top)); z-index: 5; color: var(--muted);
    font-size: 9px; opacity: 0.7; text-align: right; max-width: 46%; }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); z-index: 10; background: var(--bg); }
  @media (max-width: 600px) {
    .lab.title { font-size: 18px; } .lab.fact { font-size: 12px; max-width: 170px; } .lab.fact b { font-size: 17px; }
    .chip { font-size: 11.5px; } .year { font-size: 20px; }
    .bar button { padding: 6px 10px; font-size: 12px; } .credit { display: none; }
  }
</style>
</head>
<body>
<div id="scene"></div>
<div class="loading" id="loading">Hämtar skogen …</div>
<div class="head"><a class="back" href="./landskap.html">← Landskapet</a></div>
<svg id="lines"></svg>
<div id="labels"></div>
<div class="legend" id="legend">
  <span><i style="background:#2f7a3a"></i>skog</span>
  <span><i style="background:#ffa040"></i>huggs nu</span>
  <span><i style="background:#7a4a2a"></i>hygge</span>
  <span><i style="background:#8fb24a"></i>ungskog</span>
</div>
<div class="year" id="year"></div>
<div class="credit">Skog: Hansen m.fl., Global Forest Watch (CC BY 4.0) · Fåglar: Svensk Fågeltaxering (CC0) · Terräng: AWS Terrain Tiles</div>
<div class="bar">
  <button id="prev" aria-label="Föregående">◀</button>
  <button id="play">❚❚ Pausa</button>
  <div class="dots" id="dots"></div>
  <button id="next" aria-label="Nästa">▶</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// Berättelsen om skogen: hela Sverige med skog och avverkning (samma data som landskapet), och fem platser
// i full upplösning (tools/skog_berattelse.py) som kameran flyger ner till.

// ---- koordinater: samma som landskapet, Web Mercator där Sverige är 10 enheter långt ----
const merc = (lat, lon) => { const la = lat * Math.PI / 180;
  return [(lon + 180) / 360, (1 - Math.log(Math.tan(la) + 1 / Math.cos(la)) / Math.PI) / 2]; };
const [x0, y0] = merc(69.06, 10.95), [x1, y1] = merc(55.33, 24.17);
const CX = (x0 + x1) / 2, CY = (y0 + y1) / 2, S = 10 / (y1 - y0);
const toXZ = (lat, lon) => { const [x, y] = merc(lat, lon); return [(x - CX) * S, (y - CY) * S]; };
const HALF_X = (x1 - x0) / 2 * S, HALF_Z = 5;
const TERRAIN = 0.2 / 1700;
const NY = 26;                                    // år 2000–2025

// ---- scen ----
const el = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x05070d);
el.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.003, 200);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.minDistance = 0.04; controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI * 0.47; controls.autoRotateSpeed = 0.35;
const portrait = () => el.clientWidth < el.clientHeight;
function resize() { const w = el.clientWidth, h = el.clientHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const sun = new THREE.DirectionalLight(0xffffff, 1.0); sun.position.set(-6, 5, 4); scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff, 0.4));

// ---- hela Sverige ----
const NX = 160, NZ = Math.round(NX * HALF_Z / HALF_X);
const geo = new THREE.PlaneGeometry(HALF_X * 2, HALF_Z * 2, NX - 1, NZ - 1); geo.rotateX(-Math.PI / 2);
const P = geo.attributes.position, NV = P.count;
const inside = new Float32Array(NV), ground = new Float32Array(NV), cols = new Float32Array(NV * 3);
geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
const landMat = new THREE.MeshLambertMaterial({ vertexColors: true, transparent: true });
const land = new THREE.Mesh(geo, landMat);
scene.add(land);
let border = null, baseCol = null, hm = null;
let fShare, rate, cum, anom, ANOM_REF = 1;

async function loadSweden() {
  const g = await fetch('../data/sverige.json').then(r => r.json());
  const pts = [];
  const mask = document.createElement('canvas'); mask.width = 400; mask.height = Math.round(400 * HALF_Z / HALF_X);
  const mc = mask.getContext('2d'); mc.fillStyle = '#fff';
  const toMask = (x, z) => [(x + HALF_X) / (2 * HALF_X) * mask.width, (z + HALF_Z) / (2 * HALF_Z) * mask.height];
  for (const poly of g.geometry.coordinates) for (const ring of poly) {
    mc.beginPath();
    ring.forEach(([lon, lat], i) => {
      const [x, z] = toXZ(lat, lon); const [mx, mz] = toMask(x, z);
      i ? mc.lineTo(mx, mz) : mc.moveTo(mx, mz);
      if (i) { const [px, pz] = toXZ(ring[i - 1][1], ring[i - 1][0]); pts.push(px, 0.002, pz, x, 0.002, z); }
    });
    mc.closePath(); mc.fill();
  }
  const soft = document.createElement('canvas'); soft.width = mask.width; soft.height = mask.height;
  const sc = soft.getContext('2d'); sc.filter = 'blur(8px)'; sc.drawImage(mask, 0, 0);
  mc.globalCompositeOperation = 'source-in'; mc.drawImage(soft, 0, 0);
  const md = mc.getImageData(0, 0, mask.width, mask.height).data;
  for (let i = 0; i < NV; i++) {
    const [mx, mz] = toMask(P.getX(i), P.getZ(i));
    const ix = Math.min(mask.width - 1, Math.max(0, Math.round(mx))), iz = Math.min(mask.height - 1, Math.max(0, Math.round(mz)));
    inside[i] = Math.pow(md[(iz * mask.width + ix) * 4 + 3] / 255 * md[(iz * mask.width + ix) * 4] / 255, 1.5);
  }
  hm = await fetch('../data/sverige_hojd.json').then(r => r.json());
  for (let i = 0; i < NV; i++) {
    const m = heightAt(P.getX(i) / S + CX, P.getZ(i) / S + CY);
    ground[i] = m * TERRAIN * inside[i]; P.setY(i, ground[i]);
    const a = inside[i], l = 0.07 + Math.min(1, m / 1500) * 0.16;
    cols[i * 3] = l * 0.9 * a + 0.0196 * (1 - a); cols[i * 3 + 1] = l * a + 0.0275 * (1 - a); cols[i * 3 + 2] = l * 1.25 * a + 0.051 * (1 - a);
  }
  geo.computeVertexNormals();
  baseCol = cols.slice();
  border = new THREE.LineSegments(new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(pts, 3)),
    new THREE.LineBasicMaterial({ color: 0x8fa6c8, transparent: true, opacity: 0.35, depthTest: false }));
  border.renderOrder = 2; scene.add(border);
}
function heightAt(mx, my) {
  const ix = Math.min(hm.w - 1, Math.max(0, Math.floor((mx - hm.x0) / (hm.x1 - hm.x0) * hm.w)));
  const iy = Math.min(hm.h - 1, Math.max(0, Math.floor((my - hm.y0) / (hm.y1 - hm.y0) * hm.h)));
  return hm.m[iy * hm.w + ix];
}
const imageData = src => new Promise((ok, fail) => {
  const img = new Image(); img.onerror = fail;
  img.onload = () => { const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
    const g = c.getContext('2d'); g.drawImage(img, 0, 0); ok({ w: img.width, h: img.height, d: g.getImageData(0, 0, img.width, img.height).data }); };
  img.src = src;
});
// Skogen över hela Sverige, räknad till rutnätet (samma metod som landskapet)
async function loadForest() {
  const { w: W, h: H, d } = await imageData('../data/skog/forlust.png');
  const cnt = new Float32Array(NV), F = new Float32Array(NV), L = new Float32Array(NV * NY);
  for (let py = 0; py < H; py++) {
    const r = Math.round(py / (H - 1) * (NZ - 1));
    for (let px = 0; px < W; px++) {
      const v = r * NX + Math.round(px / (W - 1) * (NX - 1)), k = (py * W + px) * 4;
      cnt[v]++; if (d[k + 2] > 127) F[v]++;
      if (d[k] > 0) L[v * NY + d[k]] += Math.min(1, (d[k + 1] / 255 + 0.03) * 1.5);
    }
  }
  const blur = (arr, stride, off) => { for (let pass = 0; pass < 2; pass++) {
    const src = new Float32Array(NV); for (let i = 0; i < NV; i++) src[i] = arr[i * stride + off];
    for (let r = 0; r < NZ; r++) for (let c = 0; c < NX; c++) { let s = 0, k = 0;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) { const rr = r + dr, cc = c + dc;
        if (rr >= 0 && rr < NZ && cc >= 0 && cc < NX) { s += src[rr * NX + cc]; k++; } }
      arr[(r * NX + c) * stride + off] = s / k; } } };
  blur(cnt, 1, 0); blur(F, 1, 0); for (let y = 1; y < NY; y++) blur(L, NY, y);
  fShare = new Float32Array(NV); rate = new Float32Array(NV * NY); cum = new Float32Array(NV * NY); anom = new Float32Array(NV * NY);
  const pos = [];
  for (let i = 0; i < NV; i++) {
    if (!cnt[i]) continue;
    fShare[i] = F[i] / cnt[i];
    for (let y = 1; y < NY; y++) { rate[i * NY + y] = L[i * NY + y] / cnt[i]; cum[i * NY + y] = cum[i * NY + y - 1] + rate[i * NY + y]; }
    const mean = cum[i * NY + NY - 1] / (NY - 1);
    for (let y = 1; y < NY; y++) { const a = Math.max(0, rate[i * NY + y] - mean); anom[i * NY + y] = a;
      if (a > 0 && inside[i] > 0.5 && fShare[i] > 0.2) pos.push(a); }
  }
  pos.sort((a, b) => a - b); ANOM_REF = pos[Math.floor(pos.length * 0.98)] || 1;
}
// Sveriges färger ett visst år: grönt där det är skog, rostton där mycket huggits, orange puls ovanliga år
let lastNat = null;
function paintSweden(yf, pulse) {
  if (!fShare || !baseCol) return;
  const key = Math.round(yf * 20) + (pulse ? 'p' : '');
  if (key === lastNat) return; lastNat = key;
  const y0 = Math.floor(yf), fr = yf - y0;
  for (let i = 0; i < NV; i++) {
    const o = i * 3, f = fShare[i];
    if (f <= 0) { cols[o] = baseCol[o]; cols[o + 1] = baseCol[o + 1]; cols[o + 2] = baseCol[o + 2]; continue; }
    let cut = y0 < 1 ? 0 : cum[i * NY + Math.min(NY - 1, y0)];
    if (y0 + 1 >= 1 && y0 + 1 < NY) cut += rate[i * NY + y0 + 1] * fr;
    const left = Math.max(0, f - cut), rust = Math.min(0.7, cut / f * 1.6);
    let p = 0;
    if (pulse) for (let y = Math.max(1, y0 - 1); y <= Math.min(NY - 1, y0 + 2); y++) { const dd = (yf - y) / 0.35; p += anom[i * NY + y] * Math.exp(-dd * dd); }
    p = Math.min(1.5, p / ANOM_REF);
    let r = 0.06 + 0.11 * left, g = 0.22 + 0.28 * left, b = 0.10 + 0.09 * left;
    r += (0.40 - r) * rust; g += (0.20 - g) * rust; b += (0.09 - b) * rust;
    r += 0.9 * p; g += 0.5 * p; b += 0.18 * p;
    const al = Math.min(0.95, (0.15 + 0.6 * left + 0.5 * p) * Math.min(1, Math.max(0, (inside[i] - 0.2) / 0.4))), k = 1.3;
    cols[o] = baseCol[o] * (1 - al) + r * k * al; cols[o + 1] = baseCol[o + 1] * (1 - al) + g * k * al; cols[o + 2] = baseCol[o + 2] * (1 - al) + b * k * al;
  }
  geo.attributes.color.needsUpdate = true;
}

// ---- platserna i full upplösning ----
// Varje plats är en egen yta med terräng (lätt överdriven) och en färgbild som målas om när åren går:
// skog grön, huggs nu glöder orange, hygget är brunt och grönskar sedan till ungskog under ungefär tio år.
const places = {};
async function loadPlace(id, p) {
  const { w, h, d } = await imageData(`../data/skog/plats_${id}.png`);
  const [ax, az] = toXZ(p.nord, p.vast), [bx, bz] = toXZ(p.syd, p.ost);
  const wU = bx - ax, hU = bz - az, cx = (ax + bx) / 2, cz = (az + bz) / 2;
  const hg = new THREE.PlaneGeometry(wU, hU, p.hojd.w - 1, p.hojd.h - 1); hg.rotateX(-Math.PI / 2);
  const m = p.hojd.m, mMin = Math.min(...m), k = wU / 20000 * 2.5;          // 2,5 gånger överdriven höjd
  // lägg ytan strax över hela Sveriges terräng på platsen, så att den aldrig hamnar under
  const [mx, my] = merc((p.nord + p.syd) / 2, (p.vast + p.ost) / 2), base = heightAt(mx, my) * TERRAIN + 0.004;
  for (let i = 0; i < hg.attributes.position.count; i++) hg.attributes.position.setY(i, base + (m[i] - mMin) * k);
  hg.computeVertexNormals();
  // färgbilden: målas i bildens egen storlek och skalas till en kvadrat med sidan 1024, så att mipmaps fungerar
  const src = document.createElement('canvas'); src.width = w; src.height = h;
  const big = document.createElement('canvas'); big.width = big.height = 1024;
  const tex = new THREE.CanvasTexture(big);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy(); tex.minFilter = THREE.LinearMipmapLinearFilter;
  const mat = new THREE.MeshLambertMaterial({ map: tex, transparent: true, opacity: 0 });
  const mesh = new THREE.Mesh(hg, mat); mesh.position.set(cx, 0, cz); mesh.visible = false; mesh.renderOrder = 1;
  scene.add(mesh);
  // varje pixel får en egen nyans, så att skogen ser levande ut
  const noise = new Uint8Array(w * h); for (let i = 0; i < noise.length; i++) noise[i] = (Math.sin(i * 12.9898) * 43758.5453 % 1 + 1) % 1 * 255;
  // andelen skog som försvunnit, totalt och per år (för texterna)
  // och var förlusten låg varje år (tyngdpunkt), så att fakta kan sitta där det hände
  let forest = 0; const lost = new Array(NY).fill(0), su = new Array(NY).fill(0), sv = new Array(NY).fill(0);
  for (let i = 0; i < w * h; i++) {
    if (d[i * 4 + 2] > 127) { forest++; const y = d[i * 4]; if (y) { lost[y]++; su[y] += (i % w) / w; sv[y] += Math.floor(i / w) / h; } }
  }
  places[id] = { mesh, mat, tex, src, big, w, h, d, noise, cx, cz, wU, hU, top: base, last: null, hojd: p.hojd, mMin, k, base,
    lostShare: lost.reduce((a, b) => a + b, 0) / forest, lostYear: lost.map(v => v / forest), lost, su, sv };
}
function paintPlace(pl, yf) {
  const key = Math.round(yf * 12);
  if (key === pl.last) return; pl.last = key;
  const { w, h, d, noise } = pl, g = pl.src.getContext('2d'), img = g.createImageData(w, h), o = img.data;
  for (let i = 0; i < w * h; i++) {
    const y = d[i * 4], forest = d[i * 4 + 2] > 127, n = noise[i] / 255, q = i * 4;
    let r, gg, b;
    if (y && yf >= y - 0.5) {
      const age = yf - y;
      if (age < 0.6) {                               // huggs nu: glöder
        const t = Math.max(0, (age + 0.5) / 1.1); r = 255; gg = 160 + 60 * (1 - t); b = 64 + 60 * (1 - t);
      } else if (age < 3) {                          // hygge: bar mark
        r = 122 + 20 * n; gg = 78 + 12 * n; b = 44;
      } else {                                       // ungskog som grönskar under tio år
        const t = Math.min(1, (age - 3) / 10);
        r = 122 + (120 - 122) * t * 1.0 + 10 * n; gg = 78 + (170 - 78) * t + 12 * n; b = 44 + (70 - 44) * t;
        r = r * (1 - 0.3 * Math.max(0, t - 0.6) / 0.4); gg = gg * (1 - 0.15 * Math.max(0, t - 0.6) / 0.4);
      }
    } else if (forest) {                             // skog: mörk gran till ljusare löv
      r = 30 + 30 * n * n; gg = 92 + 50 * n * n; b = 46 + 16 * n;
    } else {                                         // öppen mark, sjöar och myr
      r = 52 + 10 * n; gg = 58 + 10 * n; b = 66 + 8 * n;
    }
    o[q] = r; o[q + 1] = gg; o[q + 2] = b; o[q + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const bg = pl.big.getContext('2d'); bg.imageSmoothingEnabled = true; bg.drawImage(pl.src, 0, 0, 1024, 1024);
  pl.tex.needsUpdate = true;
}

// ---- punkter i landskapet ----
// En punkt i en plats (u, v = 0–1 från nordväst) på terrängens höjd, och en punkt i Sverige.
function placePoint(pl, u, v) {
  const H = pl.hojd, i = Math.round(v * (H.h - 1)) * H.w + Math.round(u * (H.w - 1));
  return new THREE.Vector3(pl.cx + (u - 0.5) * pl.wU, pl.base + (H.m[i] - pl.mMin) * pl.k, pl.cz + (v - 0.5) * pl.hU);
}
function natPoint(lat, lon) {
  const [x, z] = toXZ(lat, lon), [mx, my] = merc(lat, lon);
  return new THREE.Vector3(x, heightAt(mx, my) * TERRAIN, z);
}
// tyngdpunkten för förlusten under några år
function centroid(pl, years) {
  let n = 0, u = 0, v = 0; for (const y of years) { n += pl.lost[y]; u += pl.su[y]; v += pl.sv[y]; }
  return n ? placePoint(pl, u / n, v / n) : placePoint(pl, 0.5, 0.5);
}
// andelen av skogen som försvunnit från år a till och med yf (med decimaler)
function lostUpTo(pl, yf, a = 1, b = NY - 1) {
  let s = 0; for (let y = a; y <= Math.min(b, Math.floor(yf)); y++) s += pl.lostYear[y];
  const nx = Math.floor(yf) + 1; if (nx >= a && nx <= b && nx < NY) s += pl.lostYear[nx] * (yf - Math.floor(yf));
  return s;
}
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);

// ---- fåglarna som små ikoner ----
const ICON = {
  mes: 'M3 15c0-3.3 3.6-5.6 8-5 .8-2.6 3.6-3.7 5.6-2.2l3.4.4-2.8 1.3c.3 3.6-2.4 6.5-6.7 6.9L7 17.6 2.5 20z',
  hackspett: 'M10.6 3c1.8-.7 3.7.3 3.9 2.1l3.8.5-3.6 1.1c.9 3.4.4 7.7-1.6 11.1L12.4 22l-1.3-4.1c-2-3.1-2.3-8.6-.5-11.7z',
  honsfagel: 'M2.5 16.2c.3-3.7 4.2-6.1 8.5-5.3.6-2.5 3.2-3.5 5.1-2.1l2.6.6-2.3 1c.6 3.7-1.8 6.4-6 6.7H7.2c-1.2 1.6-3.2 2.5-4.9 1.9 1-.5 1.5-1.2 1.6-2.1z',
};
const iconFor = n => /hackspett|Spillkråka|Gråspett|Göktyta/.test(n) ? 'hackspett' : /Orre|Tjäder|Järpe/.test(n) ? 'honsfagel' : 'mes';
let skog = null;
const pct = v => Math.round(Math.abs(v) * 100) + ' %';
const sign = (v, dir = v) => (dir < 0 ? '−' : '+') + pct(v);
const bird = n => Object.values(skog.arter).find(a => a.namn === n);
const easeOut = t => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);

// ---- etiketterna ----
// Varje etikett sitter på en punkt i landskapet (ground) och svävar en bit ovanför (lift), med en tunn linje ner.
// Den tänds vid en viss tid i scenen (at, sekunder) eller ett visst år (year), och kan uppdateras medan den syns (tick).
const labelsEl = document.getElementById('labels'), linesEl = document.getElementById('lines');
let labels = [];
function label(o) {
  const el = document.createElement('div'); el.className = 'lab ' + (o.kind || 'fact'); el.innerHTML = o.html;
  labelsEl.appendChild(el);
  const ns = 'http://www.w3.org/2000/svg';
  const line = document.createElementNS(ns, 'line'); line.setAttribute('stroke', 'rgba(255,255,255,0.55)'); line.setAttribute('stroke-width', '1');
  const dot = document.createElementNS(ns, 'circle'); dot.setAttribute('r', '2.6'); dot.setAttribute('fill', '#fff');
  if (o.kind !== 'title') { linesEl.appendChild(line); linesEl.appendChild(dot); }
  labels.push({ ...o, el, line, dot, alpha: 0, shown: null, dying: false });
}
function flock(o) {
  // en liten flock: rubrik, fåglarna en i taget med siffran som räknas upp, och en rad om jämförelsen
  const rows = o.names.map(bird).filter(Boolean);
  const html = `<div class="flock"><div class="hd">${o.head}</div>` + rows.map(a =>
    `<div class="chip ${a.skillnad < 0 ? 'down' : 'up'}"><svg viewBox="0 0 24 24"><path fill="currentColor" d="${ICON[iconFor(a.namn)]}"/></svg>`
    + `<span>${a.namn}</span><span class="n">0 %</span></div>`).join('')
    + `<div class="ft">${o.foot || `där ${pct(skog.hugget.mycket)} av skogen höggs, mot där ${pct(skog.hugget.lite)} höggs`}</div></div>`;
  label({ ...o, kind: 'fact flockbox', html, tick: (el, t) => {
    el.querySelectorAll('.chip').forEach((c, i) => {
      const ti = t - 0.6 - i * 0.55; c.classList.toggle('on', ti > 0);
      c.querySelector('.n').textContent = sign(rows[i].skillnad * easeOut(ti / 1.2), rows[i].skillnad);
    });
    el.querySelector('.ft').classList.toggle('on', t > 0.8 + rows.length * 0.55);
  } });
}
// ett faktum med rader som tänds efter varandra; {v} i en rad blir ett tal som räknas fram
function fact(o) {
  const lines = o.lines.map((l, i) => `<span class="sub" data-i="${i}">${l}</span>`).join('');
  label({ ...o, html: lines, tick: (el, t) => {
    el.querySelectorAll('.sub').forEach((sEl, i) => {
      sEl.classList.toggle('on', t > (o.delays ? o.delays[i] : i * 1.1));
      const b = sEl.querySelector('b[data-v]');
      if (b) b.textContent = pct(o.value(t));
    });
  } });
}
function clearLabels() { labels.forEach(l => l.dying = true); }
function updateLabels(dt) {
  const W = el.clientWidth, H = el.clientHeight, v = new THREE.Vector3();
  const toScreen = p => { v.copy(p).project(camera); return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H, v.z < 1]; };
  const placed = [];                      // rutor som redan har en plats i bilden, så att etiketterna inte hamnar på varandra
  for (const l of labels) {
    const gone = (l.until != null && sceneT >= l.until) || (l.untilYear != null && yf >= l.untilYear);
    const due = !l.dying && !gone && phase === 'play' && (l.at != null ? sceneT >= l.at : yf >= l.year);
    if (due && l.shown == null) l.shown = sceneT;
    l.alpha += ((due ? 1 : 0) - l.alpha) * Math.min(1, dt * (l.dying ? 6 : 3));
    const t = l.shown == null ? 0 : sceneT - l.shown;
    if (l.tick && l.shown != null) l.tick(l.el, t);
    const top = l.ground.clone(); top.y += l.lift;
    const [gx, gy, gok] = toScreen(l.ground), [x, yy, ok] = toScreen(top);
    // håll etiketten inom bilden
    const w = l.el.offsetWidth, h = l.el.offsetHeight;
    const cx = Math.min(W - w / 2 - 8, Math.max(w / 2 + 8, x));
    let ty = Math.max(h + 8, yy);
    if (l.alpha > 0.02) {
      // står den på någon som redan har en plats? prova lägena strax ovanför och under varje sådan ruta
      // och välj det närmaste som är ledigt och ryms i bilden
      const hits = t => placed.some(b => cx - w / 2 < b[2] + 4 && cx + w / 2 > b[0] - 4 && t - h < b[3] + 4 && t > b[1] - 4);
      if (hits(ty)) {
        const fits = t => t - h >= 8 && t <= H - 70 && !hits(t);
        const cands = placed.flatMap(b => [b[1] - 6, b[3] + h + 6]).filter(fits).sort((a, b) => Math.abs(a - ty) - Math.abs(b - ty));
        if (cands.length) ty = cands[0];
      }
      placed.push([cx - w / 2, ty - h, cx + w / 2, ty]);
    }
    l.py = l.py == null ? ty : l.py + (ty - l.py) * Math.min(1, dt * 6);
    const cy = l.py;
    const a = ok ? l.alpha : 0;
    Object.assign(l, { sx: cx, sy: cy, gx, gy, a });
    l.el.style.opacity = a;
    l.el.style.transform = `translate(${cx}px, ${cy}px) translate(-50%, -100%) scale(${0.9 + 0.1 * a})`;
    if (l.kind !== 'title') {
      const la = gok && ok ? a : 0;
      l.line.setAttribute('x1', gx); l.line.setAttribute('y1', gy); l.line.setAttribute('x2', cx); l.line.setAttribute('y2', cy);
      l.line.setAttribute('opacity', la); l.dot.setAttribute('cx', gx); l.dot.setAttribute('cy', gy); l.dot.setAttribute('opacity', la);
    }
  }
  labels = labels.filter(l => {
    if (l.dying && l.alpha < 0.02) { l.el.remove(); l.line.remove(); l.dot.remove(); return false; }
    return true;
  });
}

// ---- scenerna ----
const SCENES = [
  { place: null, from: 2000, to: 2000, dur: 9, build: () => {
    label({ kind: 'title', html: 'Skogslandet', ground: natPoint(64.6, 17.0), lift: 1.0, at: 0.2 });
    fact({ ground: natPoint(62.3, 15.2), lift: 0.8, at: 1.2, lines: ['År 2000 var <b>två tredjedelar</b>', 'av Sverige skog'], delays: [0, 0.6] });
    fact({ ground: natPoint(57.6, 14.6), lift: 0.6, at: 3.4, lines: ['25 år av hyggen, stormar', 'och skogens fåglar'], delays: [0, 0.8] });
  } },
  { place: 'norrbotten', from: 2000, to: 2025, dur: 20, build: pl => {
    const L = pl.wU;
    label({ kind: 'title', html: 'Norrbottens inland', ground: placePoint(pl, 0.5, 0.02), lift: 0.3 * L, at: 0.2 });
    fact({ ground: placePoint(pl, 0.2, 0.3), lift: 0.17 * L, at: 1.2, lines: ['Gammal barrskog mellan', 'Harads och Vuollerim'], delays: [0, 0.5], until: 7.5 });
    fact({ ground: centroid(pl, range(1, 25)), lift: 0.12 * L, year: 2003, lines: ['Hygge läggs till hygge', '<b data-v>0 %</b> av skogen borta'],

    flock({ ground: placePoint(pl, 0.85, 0.2), lift: 0.22 * L, at: 8, head: 'Gammelskogens fåglar', names: ['Lappmes', 'Tretåig hackspett', 'Videsparv', 'Lavskrika'] });
  } },
  { place: 'gudrun', from: 2003, to: 2008, dur: 13, build: pl => {
    const L = pl.wU, c = centroid(pl, [5]);
    label({ kind: 'title', html: 'Stormen Gudrun', ground: placePoint(pl, 0.5, 0.02), lift: 0.3 * L, at: 0.2 });
    fact({ ground: c, lift: 0.2 * L, year: 2004.6, lines: ['8 januari 2005', 'Stormen drar in', '<b data-v>0 %</b> av skogen här föll'],
      delays: [0, 0.8, 1.8], value: () => lostUpTo(pl, yf - 2000, 5, 5) });
    fact({ ground: placePoint(pl, 0.18, 0.8), lift: 0.12 * L, year: 2006, lines: ['I hela Götaland föll', '<b>75 miljoner</b> m³ skog', 'nästan ett års avverkning i Sverige'], delays: [0, 0.8, 1.8] });
  } },
  { place: 'brand', from: 2012, to: 2020, dur: 14, build: pl => {
    const L = pl.wU, c = centroid(pl, [14]);
    label({ kind: 'title', html: 'Branden i Västmanland', ground: placePoint(pl, 0.5, 0.02), lift: 0.3 * L, at: 0.2 });
    fact({ ground: c, lift: 0.22 * L, year: 2013.6, lines: ['Sommaren 2014', '<b data-v>0 %</b> av skogen i rutan brann'],
      delays: [0, 1.2], value: () => lostUpTo(pl, yf - 2000, 14, 14) });
    fact({ ground: placePoint(pl, 0.15, 0.82), lift: 0.12 * L, year: 2015.2, lines: ['<b>14 000</b> hektar', 'Sveriges största skogsbrand i modern tid'], delays: [0, 0.8] });
    fact({ ground: placePoint(pl, 0.85, 0.78), lift: 0.1 * L, year: 2017.5, lines: ['Naturreservatet Hälleskogsbrännan', 'Ny skog får växa upp fritt'], delays: [0, 0.9] });
  } },
  { place: 'barkborre', from: 2015, to: 2025, dur: 14, build: pl => {
    const L = pl.wU, c = centroid(pl, range(19, 22));
    label({ kind: 'title', html: 'Torkan och granbarkborren', ground: placePoint(pl, 0.5, 0.02), lift: 0.3 * L, at: 0.2 });
    fact({ ground: placePoint(pl, 0.2, 0.3), lift: 0.15 * L, year: 2017.7, lines: ['Torkan 2018', 'försvagar granarna'], delays: [0, 0.7], untilYear: 2022.5 });
    fact({ ground: c, lift: 0.2 * L, year: 2018.8, lines: ['Granbarkborren', '<b data-v>0 %</b> av skogen', 'dog eller höggs 2019–2022'],
      delays: [0, 1, 1.4], value: () => lostUpTo(pl, yf - 2000, 19, 22) });
  } },
  { place: 'vinnare', from: 2000, to: 2025, dur: 20, build: pl => {
    const L = pl.wU;
    label({ kind: 'title', html: 'Ungskogens fåglar', ground: placePoint(pl, 0.5, 0.02), lift: 0.3 * L, at: 0.2 });
    fact({ ground: centroid(pl, range(1, 25)), lift: 0.12 * L, year: 2003, lines: ['Ett lapptäcke av hyggen', '<b data-v>0 %</b> av skogen huggen'],
      delays: [0, 1], value: () => lostUpTo(pl, yf - 2000) });
    fact({ ground: placePoint(pl, 0.18, 0.78), lift: 0.1 * L, year: 2011, lines: ['Hyggena blir sly', 'och ung skog'], delays: [0, 0.7], untilYear: 2016.5 });
    flock({ ground: placePoint(pl, 0.85, 0.22), lift: 0.22 * L, at: 9, head: 'Har gått bättre', names: ['Orre', 'Järnsparv', 'Trädgårdssångare', 'Dubbeltrast'] });
  } },
  { place: null, from: 2001, to: 2025, dur: 16, pulse: true, build: () => {
    const a = Object.values(skog.arter);
    const down = a.filter(x => x.tydlig && x.skillnad < 0).sort((p, q) => p.skillnad - q.skillnad);
    const up = a.filter(x => x.tydlig && x.skillnad > 0).sort((p, q) => q.rutter - p.rutter).slice(0, 5);
    label({ kind: 'title', html: 'Hela Sverige', ground: natPoint(64.6, 17.0), lift: 1.0, at: 0.2 });
    fact({ ground: natPoint(57.0, 14.8), lift: 0.55, at: 1.0, lines: ['Orange: år då det höggs', 'ovanligt mycket'], delays: [0, 0.5], until: 6 });
    flock({ ground: natPoint(66.3, 20.0), lift: 0.9, at: 3, head: `${down.length} av ${a.length} skogsfåglar gick tydligt sämre`, names: down.map(x => x.namn), foot: ' ' });
    flock({ ground: natPoint(60.6, 14.2), lift: 0.8, at: 6.5, head: `${a.filter(x => x.tydlig && x.skillnad > 0).length} gick tydligt bättre`, names: up.map(x => x.namn),
      foot: `där mycket skog höggs. Samvariation, inte orsak.` });
  } },
];

// ---- kameran ----
function sweden() {
  return portrait() ? { pos: new THREE.Vector3(0.4, 11, 9.5), target: new THREE.Vector3(0, 0.1, -0.3) }
                    : { pos: new THREE.Vector3(2.4, 6.2, 5.2), target: new THREE.Vector3(0, 0.1, 0.5) };
}
function closeView(pl) {
  const d = pl.wU * (portrait() ? 2.4 : 1.35);
  // sikta strax norr om mitten, så att rubriken ovanför platsen får plats i bilden
  const target = new THREE.Vector3(pl.cx, pl.top, pl.cz - 0.12 * pl.hU);
  return { pos: target.clone().add(new THREE.Vector3(0.25 * d, 0.75 * d, 0.85 * d)), target };
}
let flight = null;    // {from, to, t, dur, fadeIn, fadeOut}
function fly(to, dur, onEnd) {
  flight = { fromPos: camera.position.clone(), fromTarget: controls.target.clone(), to, t: 0, dur, onEnd };
}
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

// ---- uppspelning ----
let idx = 0, playing = true, yf = 2000, sceneT = 0, phase = 'fly', hold = 0, current = null, natAlpha = 1;
const yearEl = document.getElementById('year');
const dotsEl = document.getElementById('dots');
SCENES.forEach((_, i) => { const s = document.createElement('span'); s.onclick = () => go(i); dotsEl.appendChild(s); });
function go(i) {
  idx = (i + SCENES.length) % SCENES.length;
  const sc = SCENES[idx], pl = sc.place && places[sc.place];
  [...dotsEl.children].forEach((s, k) => s.classList.toggle('on', k === idx));
  clearLabels(); sc.build(pl);
  yf = sc.from; sceneT = 0; hold = 0; controls.autoRotate = false;
  const prev = current; current = sc;
  if (pl) pl.mesh.visible = true;
  if (prev && prev.place && prev.place !== sc.place && pl) {
    // från en plats till en annan: först upp till Sverige, sedan ner
    phase = 'fly';
    fly(sweden(), 2.2, () => fly(closeView(pl), 3.2, () => { phase = 'play'; controls.autoRotate = true; }));
  } else {
    phase = 'fly';
    fly(pl ? closeView(pl) : sweden(), pl ? 3.6 : 2.6, () => { phase = 'play'; controls.autoRotate = !!pl; });
  }
}
document.getElementById('prev').onclick = () => go(idx - 1);
document.getElementById('next').onclick = () => go(idx + 1);
const playBtn = document.getElementById('play');
playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? '❚❚ Pausa' : '▶ Spela'; };

let last = 0;
function frame(now) {
  const dt = last ? Math.min(Math.max(0, (now - last) / 1000), 0.1) : 0; last = now;
  const sc = current, pl = sc && sc.place && places[sc.place];
  if (flight) {
    flight.t = Math.min(1, flight.t + dt / flight.dur);
    const e = ease(flight.t);
    camera.position.lerpVectors(flight.fromPos, flight.to.pos, e);
    controls.target.lerpVectors(flight.fromTarget, flight.to.target, e);
    if (flight.t >= 1) { const f = flight; flight = null; f.onEnd && f.onEnd(); }
  }
  // Sverige syns när kameran är högt upp; platsens yta tonar fram när kameran kommer nära
  const dist = camera.position.distanceTo(controls.target);
  const near = pl ? Math.min(1, Math.max(0, (1.6 - dist) / 1.1)) : 0;
  for (const [id, p] of Object.entries(places)) {
    const on = pl === p ? near : 0;
    p.mat.opacity += (on - p.mat.opacity) * Math.min(1, dt * 4);
    p.mesh.visible = p.mat.opacity > 0.01;
  }
  natAlpha = 1 - near * 0.85;
  landMat.opacity = natAlpha; if (border) border.material.opacity = 0.35 * natAlpha;
  if (sc && phase === 'play' && playing) {
    sceneT += dt;
    if (sceneT < sc.dur) yf = sc.from + (sc.to - sc.from) * Math.min(1, sceneT / (sc.dur - 1.5));
    else { hold += dt; sceneT += 0; if (hold > 5) go(idx + 1); }
  }
  paintSweden(yf - 2000, sc && sc.pulse);
  if (pl) paintPlace(pl, yf - 2000);
  yearEl.textContent = Math.round(Math.min(yf, 2025));
  controls.update(); renderer.render(scene, camera);
  updateLabels(dt);
  requestAnimationFrame(frame);
}

(async () => {
  try {
    const [, , data, sk] = await Promise.all([loadSweden(), Promise.resolve(),
      fetch('../data/skog/berattelse.json').then(r => r.json()), fetch('../data/trend/skog.json').then(r => r.json())]);
    skog = sk;
    await Promise.all([loadForest(), ...Object.entries(data.platser).map(([id, p]) => loadPlace(id, p))]);
    const s0 = sweden(); camera.position.copy(s0.pos).multiplyScalar(1.15); controls.target.copy(s0.target);
    document.getElementById('loading').style.display = 'none';
    go(0);
    requestAnimationFrame(frame);
  } catch (err) { document.getElementById('loading').textContent = 'Kunde inte hämta: ' + err.message; }
})();
</script>
